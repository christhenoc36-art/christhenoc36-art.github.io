name: Football Live Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Récupérer les matchs depuis API-Football
  env:
    API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  run: |
    python - <<'PY'
    import json
    import os
    import urllib.request
    from datetime import datetime, timezone

    key = os.environ.get("API_FOOTBALL_KEY")

    if not key:
        print("Erreur : le secret API_FOOTBALL_KEY est absent.")
        raise SystemExit(1)

    today = datetime.now(timezone.utc).strftime("%Y-%m-%d")

    url = f"https://v3.football.api-sports.io/fixtures?date={today}"

    request = urllib.request.Request(
        url,
        headers={
            "x-apisports-key": key,
            "Accept": "application/json"
        }
    )

    with urllib.request.urlopen(request, timeout=30) as response:
        data = json.load(response)

    if "response" not in data:
        print("Erreur : réponse API invalide.")
        print(data)
        raise SystemExit(1)

    matches = []

    for item in data["response"]:
        fixture = item["fixture"]
        league = item.get("league", {})
        teams = item.get("teams", {})
        goals = item.get("goals", {})
        status = fixture.get("status", {}).get("short", "")

        status_map = {
            "NS": "TIMED",
            "TBD": "TIMED",
            "1H": "IN_PLAY",
            "HT": "IN_PLAY",
            "2H": "IN_PLAY",
            "ET": "IN_PLAY",
            "BT": "IN_PLAY",
            "P": "IN_PLAY",
            "LIVE": "IN_PLAY",
            "FT": "FINISHED",
            "AET": "FINISHED",
            "PEN": "FINISHED",
            "PST": "POSTPONED",
            "CANC": "CANCELLED",
            "ABD": "CANCELLED"
        }

        matches.append({
            "id": fixture.get("id"),
            "utcDate": fixture.get("date"),
            "status": status_map.get(status, status),
            "matchday": league.get("round"),
            "stage": "REGULAR_SEASON",
            "group": None,
            "lastUpdated": datetime.now(timezone.utc).isoformat(),

            "competition": {
                "id": league.get("id"),
                "name": league.get("name"),
                "code": league.get("country"),
                "type": "LEAGUE",
                "emblem": league.get("logo")
            },

            "season": {
                "id": league.get("season"),
                "startDate": None,
                "endDate": None,
                "currentMatchday": None,
                "winner": None
            },

            "homeTeam": {
                "id": teams.get("home", {}).get("id"),
                "name": teams.get("home", {}).get("name"),
                "shortName": teams.get("home", {}).get("name"),
                "tla": None,
                "crest": teams.get("home", {}).get("logo")
            },

            "awayTeam": {
                "id": teams.get("away", {}).get("id"),
                "name": teams.get("away", {}).get("name"),
                "shortName": teams.get("away", {}).get("name"),
                "tla": None,
                "crest": teams.get("away", {}).get("logo")
            },

            "score": {
                "winner": (
                    "HOME_TEAM" if goals.get("home") is not None
                    and goals.get("away") is not None
                    and goals.get("home") > goals.get("away")
                    else "AWAY_TEAM" if goals.get("home") is not None
                    and goals.get("away") is not None
                    and goals.get("away") > goals.get("home")
                    else None
                ),
                "duration": "REGULAR",
                "fullTime": {
                    "home": goals.get("home"),
                    "away": goals.get("away")
                },
                "halfTime": {
                    "home": None,
                    "away": None
                }
            },

            "tvChannels": []
        })

    with open("matches.json", "w", encoding="utf-8") as f:
        json.dump(matches, f, ensure_ascii=False, indent=2)

    print(f"OK : {len(matches)} matchs récupérés pour {today}")
    PY

- name: Vérifier matches.json
  run: |
    if [ ! -f matches.json ]; then
      echo "Erreur : matches.json n'a pas été créé."
      exit 1
    fi

    python -m json.tool matches.json > /dev/null
    echo "matches.json est bien présent et valide." 
- name: Préparer la mise à jour
        run: |
           echo "Football Live est prêt pour l'actualisation automatique."
          echo "Aucune donnée fictive ne sera écrite dans matches.json."

- name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add matches.json

          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "chore: update football data"
            git push
          fi
