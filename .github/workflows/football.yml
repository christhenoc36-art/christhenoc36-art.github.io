name: Football Live Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Récupérer les matchs
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          key = os.environ.get("FOOTBALL_API_KEY")

          if not key:
              print("ERREUR : FOOTBALL_API_KEY est absent.")
              raise SystemExit(1)

          today = datetime.now(timezone.utc).date()

          dates = [
              today,
              today + timedelta(days=1),
              today + timedelta(days=2)
          ]

          all_matches = []

          for match_date in dates:

              date_string = match_date.strftime("%Y-%m-%d")

              print(f"Récupération : {date_string}")

              url = (
                  "https://v3.football.api-sports.io/fixtures"
                  f"?date={date_string}"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": key,
                      "Accept": "application/json"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      data = json.load(response)

              except Exception as error:

                  print(
                      f"ERREUR pour {date_string} : {error}"
                  )

                  continue

              if data.get("errors"):

                  print(
                      f"ERREUR API pour {date_string} : "
                      f"{data['errors']}"
                  )

                  continue

              fixtures = data.get("response", [])

              for item in fixtures:

                  fixture = item.get("fixture", {})
                  league = item.get("league", {})
                  teams = item.get("teams", {})
                  goals = item.get("goals", {})
                  status = fixture.get("status", {})

                  home = teams.get("home", {})
                  away = teams.get("away", {})

                  all_matches.append({

                      "id": fixture.get("id"),

                      "utcDate": fixture.get("date"),

                      "timestamp": fixture.get("timestamp"),

                      "status": status.get("short"),

                      "statusLong": status.get("long"),

                      "elapsed": status.get("elapsed"),

                      "competition": {
                          "id": league.get("id"),
                          "name": league.get("name"),
                          "country": league.get("country"),
                          "logo": league.get("logo")
                      },

                      "homeTeam": {
                          "id": home.get("id"),
                          "name": home.get("name"),
                          "shortName": home.get("name"),
                          "crest": home.get("logo")
                      },

                      "awayTeam": {
                          "id": away.get("id"),
                          "name": away.get("name"),
                          "shortName": away.get("name"),
                          "crest": away.get("logo")
                      },

                      "score": {
                          "fullTime": {
                              "home": goals.get("home"),
                              "away": goals.get("away")
                          }
                      },

                      "tvChannels": [
                          {
                              "name": "Canal+ Sport"
                          },
                          {
                              "name": "beIN SPORTS"
                          },
                          {
                              "name": "SuperSport"
                          }
                      ]

                  })

          output = {

              "lastUpdated":
                  datetime.now(timezone.utc).isoformat(),

              "from":
                  dates[0].strftime("%Y-%m-%d"),

              "to":
                  dates[-1].strftime("%Y-%m-%d"),

              "matches":
                  all_matches

          }

          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"OK : {len(all_matches)} matchs récupérés."
          )

          PY

      - name: Vérifier matches.json
        run: |
          if [ ! -f matches.json ]; then
            echo "ERREUR : matches.json n'existe pas."
            exit 1
          fi

          python -m json.tool matches.json > /dev/null

          echo "matches.json est valide."

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add matches.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour des matchs"
            git push
          fi
