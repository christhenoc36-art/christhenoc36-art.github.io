name: Football Live Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Récupérer les matchs depuis API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          api_key = os.environ.get("API_FOOTBALL_KEY")

          if not api_key:
              print("Erreur : le secret API_FOOTBALL_KEY est absent.")
              raise SystemExit(1)

          now = datetime.now(timezone.utc)

          url = "https://v3.football.api-sports.io/fixtures?live=all"

          request = urllib.request.Request(
              url,
              headers={
                  "x-apisports-key": api_key
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
          except Exception as e:
              print(f"Erreur API-Football : {e}")
              raise SystemExit(1)

          matches = []

          for item in data.get("response", []):
              fixture = item.get("fixture", {})
              teams = item.get("teams", {})
              goals = item.get("goals", {})
              league = item.get("league", {})

              matches.append({
                  "id": fixture.get("id"),
                  "utcDate": fixture.get("date"),
                  "status": item.get("fixture", {}).get("status", {}).get("short"),
                  "statusLong": item.get("fixture", {}).get("status", {}).get("long"),
                  "homeTeam": {
                      "id": teams.get("home", {}).get("id"),
                      "name": teams.get("home", {}).get("name"),
                      "shortName": teams.get("home", {}).get("name"),
                      "crest": teams.get("home", {}).get("logo")
                  },
                  "awayTeam": {
                      "id": teams.get("away", {}).get("id"),
                      "name": teams.get("away", {}).get("name"),
                      "shortName": teams.get("away", {}).get("name"),
                      "crest": teams.get("away", {}).get("logo")
                  },
                  "score": {
                      "home": goals.get("home"),
                      "away": goals.get("away")
                  },
                  "competition": {
                      "id": league.get("id"),
                      "name": league.get("name"),
                      "code": league.get("type")
                  },
                  "tvChannels": []
              })

          output = {
              "lastUpdated": now.isoformat(),
              "matches": matches
          }

          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"OK : {len(matches)} matchs en direct récupérés.")
          PY

      - name: Vérifier matches.json
        run: |
          if [ ! -f matches.json ]; then
            echo "Erreur : matches.json n'a pas été créé."
            exit 1
          fi

          python -m json.tool matches.json > /dev/null

          echo "matches.json est bien présent et valide."

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add matches.json

          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "chore: mise à jour des matchs"
            git push
          fi
