name: Football Live

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer requests
        run: python -m pip install --upgrade requests

      - name: Actualiser les matchs
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          api_key = os.environ.get("FOOTBALL_API_KEY", "").strip()

          if not api_key:
              raise SystemExit(
                  "ERREUR : le secret FOOTBALL_API_KEY est absent."
              )

          url = "https://v3.football.api-sports.io/fixtures"

          headers = {
              "x-apisports-key": api_key
          }

          params = {
              "live": "all"
          }

          try:
              response = requests.get(
                  url,
                  headers=headers,
                  params=params,
                  timeout=30
              )
          except requests.RequestException as e:
              raise SystemExit(
                  f"ERREUR de connexion API : {e}"
              )

          try:
              data = response.json()
          except ValueError:
              raise SystemExit(
                  f"ERREUR : réponse API invalide. HTTP {response.status_code}"
              )

          if response.status_code != 200:
              raise SystemExit(
                  "ERREUR API HTTP "
                  + str(response.status_code)
                  + " : "
                  + json.dumps(
                      data.get("errors", data),
                      ensure_ascii=False
                  )
              )

          if data.get("errors"):
              raise SystemExit(
                  "ERREUR API : "
                  + json.dumps(
                      data["errors"],
                      ensure_ascii=False
                  )
              )

          matches = []

          for item in data.get("response", []):
              fixture = item.get("fixture") or {}
              league = item.get("league") or {}
              teams = item.get("teams") or {}
              goals = item.get("goals") or {}
              status = fixture.get("status") or {}
              home = teams.get("home") or {}
              away = teams.get("away") or {}

              matches.append({
                  "fixture": {
                      "id": fixture.get("id"),
                      "date": fixture.get("date"),
                      "status": status.get("short"),
                      "elapsed": status.get("elapsed")
                  },
                  "league": {
                      "id": league.get("id"),
                      "name": league.get("name"),
                      "country": league.get("country"),
                      "logo": league.get("logo")
                  },
                  "home": {
                      "id": home.get("id"),
                      "name": home.get("name"),
                      "logo": home.get("logo")
                  },
                  "away": {
                      "id": away.get("id"),
                      "name": away.get("name"),
                      "logo": away.get("logo")
                  },
                  "goals": {
                      "home": goals.get("home"),
                      "away": goals.get("away")
                  }
              })

          output = {
              "lastUpdated": datetime.now(timezone.utc).isoformat(),
              "count": len(matches),
              "matches": matches
          }

          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"OK : {len(matches)} matchs récupérés."
          )
          PY

      - name: Vérifier matches.json
        run: |
          if [ ! -f matches.json ]; then
            echo "ERREUR : matches.json n'a pas été créé."
            exit 1
          fi

          python -m json.tool matches.json > /dev/null

          echo "OK : matches.json est présent et valide."

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add matches.json

          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "chore: mise à jour des matchs"
            git push origin main
          fi
