name: Football Live

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer requests
        run: python -m pip install requests

      - name: Actualiser les matchs
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          api_key = os.environ.get("API_FOOTBALL_KEY")

          if not api_key:
              raise SystemExit(
                  "Erreur : le secret API_FOOTBALL_KEY est absent."
              )

          response = requests.get(
              "https://v3.football.api-sports.io/fixtures",
              headers={
                  "x-apisports-key": api_key
              },
              params={
                  "live": "all"
              },
              timeout=30
          )

          response.raise_for_status()

          data = response.json()

          if data.get("errors"):
              raise SystemExit(
                  "Erreur API : "
                  + json.dumps(data["errors"], ensure_ascii=False)
              )

          matches = []

          for item in data.get("response", []):
              fixture = item.get("fixture", {})
              league = item.get("league", {})
              teams = item.get("teams", {})
              goals = item.get("goals", {})
              status = fixture.get("status", {})

              matches.append({
                  "fixture": {
                      "id": fixture.get("id"),
                      "date": fixture.get("date"),
                      "status": status.get("short"),
                      "elapsed": status.get("elapsed")
                  },
                  "league": {
                      "id": league.get("id"),
                      "name": league.get("name"),
                      "country": league.get("country"),
                      "logo": league.get("logo")
                  },
                  "home": {
                      "id": teams.get("home", {}).get("id"),
                      "name": teams.get("home", {}).get("name"),
                      "logo": teams.get("home", {}).get("logo")
                  },
                  "away": {
                      "id": teams.get("away", {}).get("id"),
                      "name": teams.get("away", {}).get("name"),
                      "logo": teams.get("away", {}).get("logo")
                  },
                  "goals": {
                      "home": goals.get("home"),
                      "away": goals.get("away")
                  }
              })

          result = {
              "lastUpdated": datetime.now(timezone.utc).isoformat(),
              "count": len(matches),
              "matches": matches
          }

          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"OK : {len(matches)} matchs récupérés.")
          PY

      - name: Vérifier matches.json
        run: |
          if [ ! -f matches.json ]; then
            echo "Erreur : matches.json n'a pas été créé."
            exit 1
          fi

          python -m json.tool matches.json > /dev/null

          echo "matches.json est valide."

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add matches.json

          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "chore: mise à jour des matchs"
            git push origin main
          fi
