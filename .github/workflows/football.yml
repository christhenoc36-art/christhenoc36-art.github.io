name: Actualiser les matchs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Récupérer les matchs
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          curl -s \
            -H "X-Auth-Token: $FOOTBALL_API_KEY" \
            https://api.football-data.org/v4/matches \
            -o api-response.json

          jq '{matches: .matches}' api-response.json > matches.json

      - name: Enregistrer les nouveaux matchs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.json
          git diff --cached --quiet || git commit -m "Mise à jour des matchs"
          git push
