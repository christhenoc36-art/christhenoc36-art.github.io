<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Football Live</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
    }

    header {
      padding: 22px;
      background: linear-gradient(135deg, #087f5b, #0875c9);
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      color: #dcecff;
    }

    nav {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #101a2d;
      overflow-x: auto;
    }

    nav button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      background: #1d2b43;
      color: white;
      white-space: nowrap;
    }

    nav button.active {
      background: #22c55e;
      color: #06140b;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }

    .info {
      background: #111b2e;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 18px;
    }

    .info h2 {
      margin-top: 0;
    }

    .muted {
      color: #aab6c8;
    }

    .card {
      background: #111b2e;
      border-radius: 17px;
      padding: 17px;
      margin: 13px 0;
      border: 1px solid #1f3049;
    }

    .league {
      color: #60a5fa;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .team {
      width: 40%;
      text-align: center;
      font-weight: bold;
    }

    .team img {
      width: 55px;
      height: 55px;
      object-fit: contain;
      display: block;
      margin: 0 auto 8px;
    }

    .vs {
      text-align: center;
      width: 20%;
    }

    .score {
      font-size: 23px;
      font-weight: bold;
      margin-top: 5px;
    }

    .status {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 20px;
      background: #334155;
      font-size: 12px;
    }

    .status.live {
      background: #dc2626;
      color: white;
    }

    .date {
      text-align: center;
      color: #94a3b8;
      margin-top: 14px;
      font-size: 13px;
    }

    .loading,
    .error,
    .empty {
      background: #111b2e;
      border-radius: 15px;
      padding: 22px;
      text-align: center;
      margin-top: 15px;
    }

    .error {
      border: 1px solid #dc2626;
    }

    .refresh {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      background: #0ea5e9;
      color: white;
      font-weight: bold;
      margin-top: 12px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #718096;
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ Football <span>LIVE</span></h1>
  <p>Les vrais matchs, scores et résultats en direct</p>
</header>

<nav>
  <button class="active" onclick="filterMatches('Tous', this)">
    Tous
  </button>

  <button onclick="filterMatches('En direct', this)">
    🔴 En direct
  </button>

  <button onclick="filterMatches('À venir', this)">
    📅 À venir
  </button>

  <button onclick="filterMatches('Terminés', this)">
    ✅ Terminés
