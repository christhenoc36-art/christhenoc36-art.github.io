<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Live</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #07111f;
  color: white;
}

header {
  background: #0d1b2a;
  padding: 18px;
  text-align: center;
  border-bottom: 1px solid #26384d;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin: 7px 0 0;
  color: #9fb0c2;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

.status {
  text-align: center;
  margin: 10px 0 18px;
  color: #9fb0c2;
}

.match {
  background: #101f31;
  border: 1px solid #26384d;
  border-radius: 15px;
  padding: 16px;
  margin-bottom: 14px;
}

.competition {
  color: #61dafb;
  font-size: 14px;
  margin-bottom: 12px;
  font-weight: bold;
}

.date {
  color: #8fa2b7;
  font-size: 13px;
  text-align: center;
  margin-bottom: 12px;
}

.teams {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.team {
  width: 38%;
  text-align: center;
  font-weight: bold;
}

.team img {
  width: 52px;
  height: 52px;
  object-fit: contain;
  display: block;
  margin: 0 auto 8px;
}

.score {
  width: 24%;
  text-align: center;
}

.score-number {
  font-size: 25px;
  font-weight: bold;
}

.live {
  color: #ff3b30;
  font-size: 12px;
  font-weight: bold;
  margin-top: 5px;
}

.finished {
  color: #35d07f;
  font-size: 12px;
  font-weight: bold;
  margin-top: 5px;
}

.scheduled {
  color: #61dafb;
  font-size: 12px;
  font-weight: bold;
  margin-top: 5px;
}

.error {
  background: #3a1620;
  border: 1px solid #8f3045;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
}

.empty {
  text-align: center;
  padding: 40px 15px;
  color: #9fb0c2;
}

button {
  display: block;
  margin: 15px auto;
  padding: 10px 18px;
  border: 0;
  border-radius: 9px;
  background: #1677ff;
  color: white;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>⚽ Football Live</h1>
  <p>Matchs de football en direct</p>
</header>

<div class="container">

  <button onclick="chargerMatchs()">🔄 Actualiser</button>

  <div id="status" class="status">
    Chargement des matchs...
  </div>

  <div id="matches"></div>

</div>

<script>

async function chargerMatchs() {

  const zone = document.getElementById("matches");
  const status = document.getElementById("status");

  status.textContent = "Chargement des matchs...";
  zone.innerHTML = "";

  try {

    const response = await fetch("matches.json?cache=" + Date.now());

    if (!response.ok) {
      throw new Error("Impossible de charger matches.json");
    }

    const data = await response.json();

    const matchs = data.matches || [];

    if (matchs.length === 0) {
      zone.innerHTML = `
        <div class="empty">
          Aucun match disponible pour le moment.
        </div>
      `;
      status.textContent = "0 match";
      return;
    }

    status.textContent = matchs.length + " matchs disponibles";

    matchs.forEach(match => {

      const home = match.homeTeam || {};
      const away = match.awayTeam || {};
      const competition = match.competition || {};
      const score = match.score || {};

      const homeScore =
        score.fullTime && score.fullTime.home !== null
          ? score.fullTime.home
          : "-";

      const awayScore =
        score.fullTime && score.fullTime.away !== null
          ? score.fullTime.away
          : "-";

      let statut = "À venir";
      let classe = "scheduled";

      if (match.status === "LIVE" ||
          match.status === "IN_PLAY" ||
          match.status === "PAUSED") {
        statut = "🔴 EN DIRECT";
        classe = "live";
      }

      if (match.status === "FINISHED") {
        statut = "✓ TERMINÉ";
        classe = "finished";
      }

      const date = match.utcDate
        ? new Date(match.utcDate).toLocaleString("fr-FR", {
            dateStyle: "medium",
            timeStyle: "short"
          })
        : "Date inconnue";

      const carte = document.createElement("div");

      carte.className = "match";

      carte.innerHTML = `

        <div class="competition">
          🏆 ${competition.name || "Football"}
        </div>

        <div class="date">
          ${date}
        </div>

        <div class="teams">

          <div class="team">
            <img
              src="${home.crest || ""}"
              alt=""
              onerror="this.style.display='none'"
            >
            ${home.name || "Équipe"}
          </div>

          <div class="score">

            <div class="score-number">
              ${homeScore} - ${awayScore}
            </div>

            <div class="${classe}">
              ${statut}
            </div>

          </div>

          <div class="team">
            <img
              src="${away.crest || ""}"
              alt=""
              onerror="this.style.display='none'"
            >
            ${away.name || "Équipe"}
          </div>

        </div>
      `;

      zone.appendChild(carte);

    });

  } catch (error) {

    console.error(error);

    status.textContent = "";

    zone.innerHTML = `
      <div class="error">
        ❌ Impossible de charger les matchs.<br><br>
        Vérifie que <b>matches.json</b> est bien présent
        à la racine du dépôt.
      </div>
    `;

  }
}

chargerMatchs();

setInterval(chargerMatchs, 60000);

</script>

</body>
  </html>
