<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOOTBALL LIVE</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
}

header{
  background:#101d32;
  padding:22px 15px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:30px;
  font-weight:bold;
}

.slogan{
  color:#aebbd0;
  margin-top:6px;
}

.search{
  max-width:600px;
  margin:18px auto 0;
}

.search input{
  width:100%;
  padding:14px 16px;
  border:0;
  border-radius:12px;
  font-size:16px;
}

.menu{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:15px;
  max-width:700px;
  margin:auto;
}

.menu button{
  border:0;
  border-radius:20px;
  padding:10px 16px;
  background:#172642;
  color:#fff;
  font-weight:bold;
  white-space:nowrap;
}

.menu button.active{
  background:#1769ff;
}

#matches{
  padding:5px 15px 30px;
  max-width:700px;
  margin:auto;
}

.match{
  background:#111f35;
  border-radius:18px;
  padding:18px;
  margin:14px 0;
  text-align:center;
  cursor:pointer;
}

.match:active{
  transform:scale(.98);
}

.competition{
  color:#aebbd0;
  font-size:14px;
  margin-bottom:15px;
}

.teams{
  display:flex;
  justify-content:space-around;
  align-items:center;
  gap:10px;
}

.team{
  width:40%;
  font-weight:bold;
}

.team img{
  width:55px;
  height:55px;
  object-fit:contain;
  display:block;
  margin:0 auto 8px;
}

.vs{
  color:#8f9db2;
  font-weight:bold;
}

.score{
  font-size:32px;
  font-weight:bold;
  margin:15px;
}

.status{
  font-weight:bold;
}

.live{
  color:#ff3b3b;
}

.upcoming{
  color:#4da3ff;
}

.finished{
  color:#35e879;
}

.date{
  color:#8f9db2;
  font-size:13px;
  margin-top:10px;
}

.message{
  text-align:center;
  padding:40px 15px;
  color:#b8c4d9;
}

footer{
  text-align:center;
  color:#718096;
  padding:25px;
  font-size:13px;
}

/* Fenêtre détail */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:100;
  padding:20px;
}

.modal-box{
  background:#111f35;
  max-width:550px;
  margin:60px auto;
  padding:25px;
  border-radius:20px;
  text-align:center;
}

.close{
  float:right;
  border:0;
  background:#263752;
  color:#fff;
  border-radius:50%;
  width:35px;
  height:35px;
  font-size:20px;
}

.detail-teams{
  display:flex;
  justify-content:space-around;
  align-items:center;
  margin-top:35px;
}

.detail-team img{
  width:75px;
  height:75px;
  object-fit:contain;
}

.detail-team{
  width:40%;
  font-weight:bold;
}

.detail-score{
  font-size:38px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <div class="logo">⚽ FOOTBALL LIVE</div>
  <div class="slogan">Matchs et scores de football</div>

  <div class="search">
    <input
      id="search"
      type="search"
      placeholder="🔎 Rechercher une équipe..."
    >
  </div>
</header>

<nav class="menu">
  <button class="active" data-filter="all">Tous</button>
  <button data-filter="live">🔴 En direct</button>
  <button data-filter="upcoming">🕐 À venir</button>
  <button data-filter="finished">✅ Terminés</button>
</nav>

<main id="matches">
  <div class="message">⏳ Chargement des matchs...</div>
</main>

<footer>
  © 2026 FOOTBALL LIVE
</footer>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="close" onclick="fermerDetail()">×</button>
    <div id="detail"></div>
  </div>
</div>

<script>

let tousLesMatchs=[];
let filtreActuel="all";

function traduireStatut(statut){

  const t={
    IN_PLAY:"🔴 EN DIRECT",
    PAUSED:"⏸️ PAUSE",
    FINISHED:"✅ TERMINÉ",
    SCHEDULED:"🕐 À VENIR",
    TIMED:"🕐 À VENIR",
    POSTPONED:"⏸️ REPORTÉ",
    CANCELLED:"❌ ANNULÉ",
    SUSPENDED:"⚠️ SUSPENDU"
  };

  return t[statut] || "🕐 À VENIR";
}

function categorie(statut){

  if(statut==="IN_PLAY" || statut==="PAUSED")
    return "live";

  if(statut==="FINISHED")
    return "finished";

  return "upcoming";
}

function afficherDate(date){

  if(!date) return "";

  return new Date(date).toLocaleString(
    "fr-FR",
    {
      dateStyle:"short",
      timeStyle:"short"
    }
  );
}

function afficherMatchs(){

  const container=document.getElementById("matches");

  const recherche=document
    .getElementById("search")
    .value
    .toLowerCase()
    .trim();

  const matchs=tousLesMatchs.filter(match=>{

    const cat=categorie(match.status);

    const domicile=match.homeTeam?.name || "";
    const exterieur=match.awayTeam?.name || "";

    const texte=(domicile+" "+exterieur).toLowerCase();

    return (
      (filtreActuel==="all" || filtreActuel===cat) &&
      (recherche==="" || texte.includes(recherche))
    );
  });

  if(matchs.length===0){

    container.innerHTML=
      '<div class="message">⚽ Aucun match trouvé.</div>';

    return;
  }

  container.innerHTML="";

  matchs.forEach((match,index)=>{

    const domicile=match.homeTeam?.name || "Équipe domicile";
    const exterieur=match.awayTeam?.name || "Équipe extérieure";

    const logoDomicile=match.homeTeam?.crest || "";
    const logoExterieur=match.awayTeam?.crest || "";

    const scoreDomicile=match.score?.fullTime?.home ?? "-";
    const scoreExterieur=match.score?.fullTime?.away ?? "-";

    const statut=match.status || "SCHEDULED";
    const cat=categorie(statut);

    const competition=
      match.competition?.name || "Football";

    const date=afficherDate(match.utcDate);

    const carte=document.createElement("div");

    carte.className="match";

    carte.innerHTML=`

      <div class="competition">
        🏆 ${competition}
      </div>

      <div class="teams">

        <div class="team">

          ${
            logoDomicile
            ? `<img src="${logoDomicile}" alt="">`
            : "⚽"
          }

          ${domicile}

        </div>

        <div class="vs">
          VS
        </div>

        <div class="team">

          ${
            logoExterieur
            ? `<img src="${logoExterieur}" alt="">`
            : "⚽"
          }

          ${exterieur}

        </div>

      </div>

      <div class="score">
        ${scoreDomicile} - ${scoreExterieur}
      </div>

      <div class="status ${cat}">
        ${traduireStatut(statut)}
      </div>

      <div class="date">
        ${date}
      </div>
    `;

    carte.onclick=()=>ouvrirDetail(match);

    container.appendChild(carte);
  });
}

async function chargerMatchs(){

  try{

    const response=await fetch(
      "matches.json?cache="+Date.now()
    );

    if(!response.ok)
      throw new Error();

    const data=await response.json();

    tousLesMatchs=data.matches || [];

    afficherMatchs();

  }catch(e){

    document.getElementById("matches").innerHTML=`
      <div class="message">
        ❌ Impossible de charger les matchs.
      </div>
    `;
  }
}

function ouvrirDetail(match){

  const domicile=match.homeTeam?.name || "Équipe domicile";
  const exterieur=match.awayTeam?.name || "Équipe extérieure";

  const logoDomicile=match.homeTeam?.crest || "";
  const logoExterieur=match.awayTeam?.crest || "";

  const homeScore=match.score?.fullTime?.home ?? "-";
  const awayScore=match.score?.fullTime?.away ?? "-";

  const competition=
    match.competition?.name || "Football";

  const statut=traduireStatut(
    match.status || "SCHEDULED"
  );

  document.getElementById("detail").innerHTML=`

    <h2>🏆 ${competition}</h2>

    <div class="detail-teams">

      <div class="detail-team">

        ${
          logoDomicile
          ? `<img src="${logoDomicile}" alt="">`
          : "⚽"
        }

        <p>${domicile}</p>

      </div>

      <div>

        <div class="detail-score">
          ${homeScore} - ${awayScore}
        </div>

        <div>
          ${statut}
        </div>

      </div>

      <div class="detail-team">

        ${
          logoExterieur
          ? `<img src="${logoExterieur}" alt="">`
          : "⚽"
        }

        <p>${exterieur}</p>

      </div>

    </div>

    <p>
      🕐 ${afficherDate(match.utcDate)}
    </p>
  `;

  document.getElementById("modal").style.display="block";
}

function fermerDetail(){

  document.getElementById("modal").style.display="none";
}

document
.querySelectorAll(".menu button")
.forEach(button=>{

  button.addEventListener("click",()=>{

    document
      .querySelectorAll(".menu button")
      .forEach(btn=>btn.classList.remove("active"));

    button.classList.add("active");

    filtreActuel=button.dataset.filter;

    afficherMatchs();
  });
});

document
.getElementById("search")
.addEventListener("input",afficherMatchs);

chargerMatchs();

setInterval(
  chargerMatchs,
  60000
);

</script>

</body>
  </html>
