<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SportLive</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#070b12;
  --card:#111827;
  --card2:#172033;
  --text:#fff;
  --muted:#94a3b8;
  --accent:#22c55e;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  padding:15px;
  background:rgba(7,11,18,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #1e293b;
}

.top{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.logo span{
  color:var(--accent);
}

.search{
  background:#111827;
  border:1px solid #263449;
  color:white;
  border-radius:12px;
  padding:11px 14px;
  width:190px;
}

main{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

/* SPORTS */

.sports{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:4px 0 15px;
}

.sport{
  min-width:120px;
  height:90px;
  border:0;
  border-radius:18px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  background:#172033;
  border:1px solid #263449;
}

.sport .icon{
  font-size:34px;
  display:block;
}

.sport small{
  color:#cbd5e1;
}

.sport.active{
  border:2px solid var(--accent);
}

/* HERO */

.hero{
  min-height:230px;
  border-radius:24px;
  padding:25px;
  margin-bottom:22px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 80% 30%,rgba(34,197,94,.45),transparent 35%),
    linear-gradient(135deg,#10291d,#081018);
}

.hero.basket{
  background:
    radial-gradient(circle at 80% 30%,rgba(249,115,22,.45),transparent 35%),
    linear-gradient(135deg,#35170b,#0c1018);
}

.hero.tennis{
  background:
    radial-gradient(circle at 80% 30%,rgba(132,204,22,.45),transparent 35%),
    linear-gradient(135deg,#26300b,#081018);
}

.hero.racing{
  background:
    radial-gradient(circle at 80% 30%,rgba(239,68,68,.45),transparent 35%),
    linear-gradient(135deg,#320d12,#081018);
}

.hero.boxing{
  background:
    radial-gradient(circle at 80% 30%,rgba(168,85,247,.45),transparent 35%),
    linear-gradient(135deg,#241033,#081018);
}

.hero h1{
  font-size:32px;
  margin:0 0 8px;
}

.hero p{
  color:#cbd5e1;
  max-width:550px;
}

.hero-ball{
  position:absolute;
  right:35px;
  bottom:10px;
  font-size:115px;
  opacity:.75;
}

/* TABS */

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.tab{
  border:0;
  padding:11px 17px;
  border-radius:20px;
  color:#cbd5e1;
  background:#172033;
  cursor:pointer;
}

.tab.active{
  background:var(--accent);
  color:#041008;
  font-weight:bold;
}

/* MATCH */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.section-title h2{
  margin:12px 0;
}

.matches{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
  gap:14px;
}

.match{
  background:linear-gradient(145deg,#111827,#0d1421);
  border:1px solid #1e293b;
  border-radius:20px;
  padding:18px;
  transition:.2s;
}

.match:hover{
  transform:translateY(-2px);
  border-color:var(--accent);
}

.league{
  color:#60a5fa;
  font-size:13px;
  font-weight:bold;
  margin-bottom:16px;
}

.teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
  text-align:center;
}

.team img{
  width:52px;
  height:52px;
  object-fit:contain;
}

.team-name{
  font-weight:bold;
  margin-top:7px;
  font-size:14px;
}

.vs{
  color:#94a3b8;
  font-weight:bold;
}

.time{
  text-align:center;
  margin-top:14px;
  color:#94a3b8;
  font-size:13px;
}

.live{
  display:inline-block;
  background:#dc2626;
  color:white;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  margin-bottom:7px;
}

.watch{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  margin-top:15px;
  background:var(--accent);
  color:#041008;
  font-weight:900;
  cursor:pointer;
}

.channel{
  margin-top:12px;
  padding:10px;
  background:#0b1220;
  border-radius:10px;
  color:#cbd5e1;
  font-size:13px;
}

/* PLAYER */

.player{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#000;
  padding:15px;
}

.player.show{
  display:flex;
  flex-direction:column;
}

.player-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.close{
  background:#dc2626;
  color:white;
  border:0;
  border-radius:10px;
  padding:10px 15px;
}

.video{
  width:100%;
  max-width:1000px;
  margin:auto;
  aspect-ratio:16/9;
  background:#050505;
  border-radius:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#94a3b8;
}

video{
  width:100%;
  height:100%;
  border-radius:15px;
}

.message{
  text-align:center;
  padding:35px;
  color:#94a3b8;
}

footer{
  text-align:center;
  padding:35px;
  color:#64748b;
}

/* MOBILE */

@media(max-width:600px){

  .top{
    flex-wrap:wrap;
  }

  .search{
    width:100%;
  }

  .hero{
    min-height:210px;
  }

  .hero-ball{
    font-size:85px;
    right:15px;
  }

  .hero h1{
    font-size:27px;
  }

}
</style>
</head>

<body>

<header>
  <div class="top">

    <div class="logo">
      ⚡ Sport<span>Live</span>
    </div>

    <input
      id="search"
      class="search"
      placeholder="🔍 Rechercher..."
      oninput="searchMatches()"
    >

  </div>
</header>

<main>

  <!-- SPORTS -->

  <div class="sports">

    <button class="sport active" onclick="changeSport('football',this)">
      <span class="icon">⚽</span>
      Football
      <small>Live</small>
    </button>

    <button class="sport" onclick="changeSport('basket',this)">
      <span class="icon">🏀</span>
      Basket
      <small>Live</small>
    </button>

    <button class="sport" onclick="changeSport('tennis',this)">
      <span class="icon">🎾</span>
      Tennis
      <small>Live</small>
    </button>

    <button class="sport" onclick="changeSport('racing',this)">
      <span class="icon">🏎️</span>
      Auto
      <small>Live</small>
    </button>

    <button class="sport" onclick="changeSport('boxing',this)">
      <span class="icon">🥊</span>
      Boxe
      <small>Live</small>
    </button>

  </div>


  <!-- HERO -->

  <section id="hero" class="hero">

    <div>
      <h1 id="heroTitle">
        ⚽ Football Live
      </h1>

      <p id="heroText">
        Regarde les événements sportifs en direct
        et retrouve les prochaines diffusions.
      </p>
    </div>

    <div id="heroBall" class="hero-ball">
      ⚽
    </div>

  </section>


  <!-- TABS -->

  <div class="tabs">

    <button
      class="tab active"
      onclick="setFilter('live',this)"
    >
      🔴 En direct
    </button>

    <button
      class="tab"
      onclick="setFilter('upcoming',this)"
    >
      🕐 À venir
    </button>

    <button
      class="tab"
      onclick="setFilter('all',this)"
    >
      Tous
    </button>

  </div>


  <div class="section-title">
    <h2 id="sectionTitle">
      🔴 En direct
    </h2>
  </div>


  <section id="matches" class="matches">

    <div class="message">
      ⏳ Chargement des événements...
    </div>

  </section>

</main>


<footer>
  SportLive © 2026
</footer>


<!-- PLAYER -->

<div id="player" class="player">

  <div class="player-top">

    <strong id="playerTitle">
      📺 Diffusion
    </strong>

    <button
      class="close"
      onclick="closePlayer()"
    >
      ✕ Fermer
    </button>

  </div>

  <div id="videoBox" class="video">

    <div class="message">
      Sélectionne une diffusion officielle
      pour lancer le lecteur.
    </div>

  </div>

</div>


<script>

let sport = "football";
let filter = "live";
let allMatches = [];


/* =========================
   THÈMES
========================= */

const themes = {

  football:{
    title:"⚽ Football Live",
    text:"Les matchs de football en direct et les prochaines diffusions.",
    icon:"⚽"
  },

  basket:{
    title:"🏀 Basketball Live",
    text:"Les rencontres de basketball et leurs diffusions.",
    icon:"🏀"
  },

  tennis:{
    title:"🎾 Tennis Live",
    text:"Les tournois et rencontres de tennis.",
    icon:"🎾"
  },

  racing:{
    title:"🏎️ Racing Live",
    text:"Les courses automobiles et événements en direct.",
    icon:"🏎️"
  },

  boxing:{
    title:"🥊 Boxing Live",
    text:"Les combats et événements de boxe.",
    icon:"🥊"
  }

};


/* =========================
   CHANGER SPORT
========================= */

function changeSport(newSport,button){

  sport = newSport;

  document
    .querySelectorAll(".sport")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

  const data = themes[newSport];

  document.getElementById("heroTitle").textContent =
    data.title;

  document.getElementById("heroText").textContent =
    data.text;

  document.getElementById("heroBall").textContent =
    data.icon;

  document.getElementById("hero").className =
    "hero " + (
      newSport === "football"
      ? ""
      : newSport
    );

  /*
    Pour l'instant, l'API /api/matches
    fournit le football.
    Basket/tennis/etc. seront branchés
    à leurs sources respectives ensuite.
  */

  if(newSport !== "football"){

    document.getElementById("matches").innerHTML = `
      <div class="message">
        ${data.icon}<br><br>
        La section ${newSport} est prête.<br>
        Nous allons maintenant connecter
        sa source de matchs.
      </div>
    `;

    return;
  }

  renderMatches();

}


/* =========================
   FILTRES
========================= */

function setFilter(newFilter,button){

  filter = newFilter;

  document
    .querySelectorAll(".tab")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

  document.getElementById("sectionTitle").textContent =
    newFilter === "live"
      ? "🔴 En direct"
      : newFilter === "upcoming"
      ? "🕐 À venir"
      : "🏆 Tous les matchs";

  renderMatches();

}


/* =========================
   API
========================= */

async function loadMatches(){

  try{

    const response =
      await fetch("/api/matches");

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error || "Erreur API"
      );

    }

    allMatches =
      data.response || [];

    renderMatches();

  }

  catch(error){

    console.error(error);

    document.getElementById("matches").innerHTML = `
      <div class="message">
        ❌ Impossible de charger les matchs.<br><br>
        Vérifie le déploiement Vercel et
        <b>football_api_key</b>.
      </div>
    `;

  }

}


/* =========================
   AFFICHAGE
========================= */

function renderMatches(){

  const container =
    document.getElementById("matches");

  if(sport !== "football") return;


  let matches =
    allMatches.filter(match => {

      const status =
        match.fixture?.status?.short;

      const live = [
        "1H",
        "2H",
        "HT",
        "ET",
        "P",
        "LIVE"
      ].includes(status);

      const finished = [
        "FT",
        "AET",
        "PEN"
      ].includes(status);

      if(filter === "live")
        return live;

      if(filter === "upcoming")
        return !live && !finished;

      return true;

    });


  if(matches.length === 0){

    container.innerHTML = `
      <div class="message">
        Aucun événement dans cette catégorie.
      </div>
    `;

    return;

  }


  container.innerHTML =
    matches.map(createMatchCard).join("");

}


/* =========================
   CARTE
========================= */

function createMatchCard(match){

  const fixture =
    match.fixture;

  const league =
    match.league;

  const home =
    match.teams?.home;

  const away =
    match.teams?.away;

  const status =
    fixture?.status?.short || "NS";


  const isLive = [
    "1H",
    "2H",
    "HT",
    "ET",
    "P",
    "LIVE"
  ].includes(status);


  const date =
    new Date(fixture.date);


  const time =
    date.toLocaleTimeString(
      "fr-FR",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  const id =
    fixture.id;


  return `

    <article class="match">

      <div class="league">
        🏆 ${escapeHTML(league?.name || "Football")}
      </div>


      <div class="teams">

        <div class="team">

          <img
            src="${escapeHTML(home?.logo || "")}"
            alt=""
          >

          <div class="team-name">
            ${escapeHTML(home?.name || "Équipe")}
          </div>

        </div>


        <div class="vs">

          ${
            isLive
            ? `<div class="live">🔴 LIVE</div>`
            : `<div>${time}</div>`
          }

          <div>VS</div>

        </div>


        <div class="team">

          <img
            src="${escapeHTML(away?.logo || "")}"
            alt=""
          >

          <div class="team-name">
            ${escapeHTML(away?.name || "Équipe")}
          </div>

        </div>

      </div>


      <div class="time">

        ${date.toLocaleDateString("fr-FR")}

      </div>


      <!--
        Le diffuseur sera renseigné
        quand une source officielle
        sera disponible.
      -->

      <div class="channel">

        📺 Diffuseur :
        <strong>À déterminer</strong>

      </div>


      <button
        class="watch"
        onclick="openPlayer(${id})"
      >

        ▶️ REGARDER

      </button>

    </article>

  `;

}


/* =========================
   LECTEUR
========================= */

function openPlayer(matchId){

  const match =
    allMatches.find(
      m => m.fixture?.id === matchId
    );


  document
    .getElementById("player")
    .classList.add("show");


  document
    .getElementById("playerTitle")
    .textContent =
      "📺 " +
      (
        match
        ? `${match.teams?.home?.name} - ${match.teams?.away?.name}`
        : "Diffusion"
      );


  /*
    Aucun flux n'est inventé ici.
    Quand nous aurons une URL de diffusion
    officielle/autorisée, elle sera chargée
    dans ce lecteur.
  */

  document
    .getElementById("videoBox")
    .innerHTML = `

      <div class="message">

        📺 Diffusion non disponible pour
        ce match pour le moment.

        <br><br>

        Le lecteur est prêt à recevoir
        un flux officiel/autorisé.

      </div>

  `;

}


function closePlayer(){

  document
    .getElementById("player")
    .classList.remove("show");

}


/* =========================
   RECHERCHE
========================= */

function searchMatches(){

  const query =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  if(!query){

    renderMatches();
    return;

  }


  const results =
    allMatches.filter(match => {

      const home =
        match.teams?.home?.name
        ?.toLowerCase() || "";

      const away =
        match.teams?.away?.name
        ?.toLowerCase() || "";

      const league =
        match.league?.name
        ?.toLowerCase() || "";


      return (
        home.includes(query) ||
        away.includes(query) ||
        league.includes(query)
      );

    });


  const old =
    allMatches;

  allMatches =
    results;

  renderMatches();

  allMatches =
    old;

}


/* =========================
   SÉCURITÉ
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char])
    );

}


/* =========================
   DÉMARRAGE
========================= */

loadMatches();


/* =========================
   ACTUALISATION
========================= */

setInterval(
  loadMatches,
  60000
);

</script>

</body>
  </html>
