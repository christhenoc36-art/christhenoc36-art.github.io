<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Live</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #07111f;
  color: white;
}

header {
  background: #0b1d33;
  padding: 22px 15px;
  text-align: center;
  border-bottom: 2px solid #1c456d;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 8px 0 0;
  color: #a9c8e8;
}

.container {
  width: 94%;
  max-width: 850px;
  margin: 20px auto;
}

.status {
  background: #12304d;
  padding: 15px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 22px;
}

.section {
  margin-bottom: 28px;
}

.section-title {
  font-size: 21px;
  font-weight: bold;
  margin: 0 0 13px;
  padding: 12px 14px;
  border-radius: 12px;
  background: #102840;
}

.match {
  background: #0d1b2d;
  border: 1px solid #23476d;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 15px;
}

.competition {
  text-align: center;
  color: #75b8ff;
  font-size: 14px;
  margin-bottom: 16px;
}

.teams {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.team {
  width: 40%;
  text-align: center;
}

.team img {
  width: 65px;
  height: 65px;
  object-fit: contain;
  display: block;
  margin: 0 auto 9px;
}

.team-name {
  font-size: 15px;
  font-weight: bold;
}

.score {
  width: 20%;
  text-align: center;
  font-size: 23px;
  font-weight: bold;
}

.datetime {
  text-align: center;
  margin-top: 18px;
  padding-top: 13px;
  border-top: 1px solid #23405e;
  color: #d9e9f8;
  line-height: 1.8;
}

.badge {
  display: inline-block;
  margin-top: 8px;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

.live {
  background: #d90429;
}

.upcoming {
  background: #1769aa;
}

.finished {
  background: #455a64;
}

.tv {
  margin-top: 14px;
  padding: 12px;
  background: #132b43;
  border-radius: 12px;
}

.tv-title {
  color: #ffd65a;
  font-weight: bold;
  margin-bottom: 9px;
}

.channel {
  display: inline-block;
  background: #1c3b58;
  border-radius: 8px;
  padding: 7px 9px;
  margin: 3px;
  font-size: 13px;
}

.empty {
  color: #8fa6bc;
  text-align: center;
  padding: 20px;
}

.error {
  background: #4a1820;
  color: #ffb8c0;
  padding: 16px;
  border-radius: 12px;
  text-align: center;
}

footer {
  text-align: center;
  color: #71869b;
  padding: 25px 10px;
  font-size: 13px;
}
</style>
</head>

<script>

let categorieSelectionnee = null;

function ouvrirCategorie(categorie) {

  categorieSelectionnee = categorie;

  // Cacher la page d'accueil
  document.getElementById("homePage").style.display = "none";

  // Afficher les matchs
  afficherCategorie();

  // Réessayer après le chargement des matchs
  setTimeout(afficherCategorie, 300);
  setTimeout(afficherCategorie, 1000);
}


function afficherCategorie() {

  if (!categorieSelectionnee) {
    return;
  }

  const matchs =
    document.querySelectorAll(".match");

  matchs.forEach(match => {

    let afficher = false;

    if (
      categorieSelectionnee === "live" &&
      match.querySelector(".badge.live")
    ) {
      afficher = true;
    }

    if (
      categorieSelectionnee === "upcoming" &&
      match.querySelector(".badge.upcoming")
    ) {
      afficher = true;
    }

    if (
      categorieSelectionnee === "finished" &&
      match.querySelector(".badge.finished")
    ) {
      afficher = true;
    }

    match.style.display =
      afficher ? "" : "none";
  });


  // Cacher les sections qui n'ont aucun match visible
  document.querySelectorAll(".section").forEach(section => {

    const matchsVisibles =
      section.querySelectorAll(
        ".match:not([style*='display: none'])"
      );

    section.style.display =
      matchsVisibles.length > 0 ? "" : "none";
  });

}

  </script>
<body>
<!-- PAGE D'ACCUEIL -->
<div id="homePage" style="
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px 15px;
  background:#07111f;
">

  <div style="width:100%;max-width:520px;">

    <div style="
      background:#0b1d33;
      border:1px solid #23476d;
      border-radius:22px;
      padding:30px 20px;
      margin-bottom:25px;
    ">

      <div style="font-size:65px;">
        ⚽
      </div>

      <h1 style="
        margin:10px 0;
        font-size:38px;
      ">
        Football Live
      </h1>

      <p style="
        margin:0;
        color:#a9c8e8;
        font-size:17px;
      ">
        Scores, matchs en direct et résultats
      </p>

    </div>


    <!-- DIRECT -->
    <button
      type="button"
      onclick="ouvrirCategorie('live')"
      style="
        width:100%;
        padding:18px;
        margin:7px 0;
        border:1px solid #23476d;
        border-radius:16px;
        background:#d90429;
        color:white;
        font-size:19px;
        font-weight:bold;
      "
    >
      🔴 Matchs en direct
    </button>


    <!-- À VENIR -->
    <button
      type="button"
      onclick="ouvrirCategorie('upcoming')"
      style="
        width:100%;
        padding:18px;
        margin:7px 0;
        border:1px solid #23476d;
        border-radius:16px;
        background:#1769aa;
        color:white;
        font-size:19px;
        font-weight:bold;
      "
    >
      🕐 Matchs à venir
    </button>


    <!-- TERMINÉS -->
    <button
      type="button"
      onclick="ouvrirCategorie('finished')"
      style="
        width:100%;
        padding:18px;
        margin:7px 0;
        border:1px solid #23476d;
        border-radius:16px;
        background:#455a64;
        color:white;
        font-size:19px;
        font-weight:bold;
      "
    >
      ✅ Matchs terminés
    </button>

  </div>

</div>
<header>
  <h1>⚽ Football Live</h1>
  <p>Matchs, scores, horaires et diffusion TV</p>
</header>

<div class="container">

  <div id="status" class="status">
    Chargement des matchs...
  </div>

<input
  id="searchInput"
  type="text"
  placeholder="🔎 Rechercher une équipe..."
  oninput="filterMatches()"
  style="
    display:block;
    width:100%;
    max-width:500px;
    margin:0 auto 12px;
    padding:13px 15px;
    border:1px solid #23476d;
    border-radius:12px;
    background:#0d1b2d;
    color:white;
    font-size:16px;
    outline:none;
  "
>

<button
  onclick="loadMatches()"
  style="
    display:block;
    margin:0 auto 20px;
    padding:12px 20px;
    border:0;
    border-radius:12px;
    background:#1769aa;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
  "
>
  🔄 Actualiser les matchs
</button>
  <div id="content"></div>

</div>

<footer>
  Mise à jour automatique toutes les 5 minutes
</footer>


<script>

const content = document.getElementById("content");
const statusBox = document.getElementById("status");


function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function getMatchStatus(match) {

  const status = String(match.status || "").toUpperCase();

  const liveStatuses = [
    "1H",
    "2H",
    "HT",
    "ET",
    "P",
    "LIVE"
  ];

  const finishedStatuses = [
    "FT",
    "AET",
    "PEN"
  ];

  if (liveStatuses.includes(status)) {
    return "live";
  }

  if (finishedStatuses.includes(status)) {
    return "finished";
  }

  return "upcoming";
}


function getTeam(match, side) {

  if (side === "home") {
    return match.homeTeam || match.home || {};
  }

  return match.awayTeam || match.away || {};
}


function getCompetition(match) {

  if (typeof match.competition === "string") {
    return match.competition;
  }

  if (match.competition && match.competition.name) {
    return match.competition.name;
  }

  if (match.league && match.league.name) {
    return match.league.name;
  }

  return "Compétition";
}


function getDate(match) {

  return (
    match.utcDate ||
    match.date ||
    match.fixture?.date ||
    ""
  );
}


function formatDateTime(value) {

  if (!value) {
    return {
      date: "Date inconnue",
      time: "Heure inconnue"
    };
  }

  const date = new Date(value);

  if (isNaN(date.getTime())) {
    return {
      date: "Date inconnue",
      time: "Heure inconnue"
    };
  }

  return {
    date: date.toLocaleDateString("fr-FR", {
      weekday: "long",
      day: "2-digit",
      month: "long",
      year: "numeric"
    }),

    time: date.toLocaleTimeString("fr-FR", {
      hour: "2-digit",
      minute: "2-digit"
    })
  };
}


function getScore(match) {

  if (
    match.score &&
    match.score.fullTime
  ) {

    const home = match.score.fullTime.home;
    const away = match.score.fullTime.away;

    if (
      home !== null &&
      home !== undefined &&
      away !== null &&
      away !== undefined
    ) {
      return `${home} - ${away}`;
    }
  }

  return "VS";
}


function getTV(match) {

  const channels = [
    "Canal+ Sport",
    "beIN SPORTS",
    "SuperSport"
  ];

  /*
    Si le JSON contient réellement des chaînes TV,
    on les utilise.
  */

  let realChannels =
    match.tvChannels ||
    match.tv_channels ||
    match.channels ||
    [];

  if (!Array.isArray(realChannels)) {
    realChannels = [];
  }

  const names = realChannels
    .map(channel => {

      if (typeof channel === "string") {
        return channel;
      }

      return channel?.name ||
             channel?.channel ||
             "";
    })
    .filter(Boolean);


  /*
    Si aucune chaîne réelle n'est fournie,
    on affiche les chaînes prévues par le site.
  */

  const finalChannels =
    names.length > 0
      ? names
      : channels;


  return `
    <div class="tv">

      <div class="tv-title">
        📺 Diffusion TV
      </div>

      ${finalChannels.map(channel => `
        <span class="channel">
          📺 ${escapeHTML(channel)}
        </span>
      `).join("")}

    </div>
  `;
}


function createMatchCard(match) {

  const home = getTeam(match, "home");
  const away = getTeam(match, "away");

  const homeName =
    home.name ||
    home.shortName ||
    "Équipe inconnue";

  const awayName =
    away.name ||
    away.shortName ||
    "Équipe inconnue";

  const homeLogo =
    home.crest ||
    home.logo ||
    "";

  const awayLogo =
    away.crest ||
    away.logo ||
    "";

  const competition =
    getCompetition(match);

  const dateTime =
    formatDateTime(getDate(match));

  const matchStatus =
    getMatchStatus(match);

  let badge = "";

  if (matchStatus === "live") {

    badge = `
      <span class="badge live">
        🔴 EN DIRECT
      </span>
    `;

  } else if (matchStatus === "finished") {

    badge = `
      <span class="badge finished">
        ✅ TERMINÉ
      </span>
    `;

  } else {

    badge = `
      <span class="badge upcoming">
        🕐 À VENIR
      </span>
    `;
  }


  return `

    <div class="match">

      <div class="competition">
        🏆 ${escapeHTML(competition)}
      </div>

      <div class="teams">

        <div class="team">

          ${
            homeLogo
            ? `
              <img
                src="${escapeHTML(homeLogo)}"
                alt="${escapeHTML(homeName)}"
                onerror="this.style.display='none'"
              >
            `
            : ""
          }

          <div class="team-name">
            ${escapeHTML(homeName)}
          </div>

        </div>


        <div class="score">
          ${escapeHTML(getScore(match))}
          <br>
          ${badge}
        </div>


        <div class="team">

          ${
            awayLogo
            ? `
              <img
                src="${escapeHTML(awayLogo)}"
                alt="${escapeHTML(awayName)}"
                onerror="this.style.display='none'"
              >
            `
            : ""
          }

          <div class="team-name">
            ${escapeHTML(awayName)}
          </div>

        </div>

      </div>


      <div class="datetime">
<button
  type="button"
  class="watch-button"
  onclick='regarderMatch({
    homeTeam: "${escapeHTML(homeName)}",
    awayTeam: "${escapeHTML(awayName)}",
    streamUrl: ""
  })'>
  ▶️ Regarder
</button>
        📅 ${escapeHTML(dateTime.date)}
        <br>

        🕐 <strong>
          ${escapeHTML(dateTime.time)}
        </strong>

      </div>


      ${getTV(match)}

    </div>
  `;
}


function getDateKey(match) {

  const value = getDate(match);

  if (!value) {
    return "";
  }

  const date = new Date(value);

  if (isNaN(date.getTime())) {
    return "";
  }

  return date.toISOString().slice(0, 10);
}


function getDayLabel(dateKey) {

  if (!dateKey) {
    return "Autres matchs";
  }

  const date = new Date(dateKey + "T00:00:00");

  return date.toLocaleDateString("fr-FR", {
    weekday: "long",
    day: "2-digit",
    month: "long",
    year: "numeric"
  });
}


function renderSection(title, matches) {

  if (!matches.length) {
    return "";
  }

  return `

    <div class="section">

      <div class="section-title">
        ${title}
      </div>

      ${matches.map(createMatchCard).join("")}

    </div>
  `;
}


async function loadMatches() {

  try {

    const response = await fetch(
      "matches.json?t=" + Date.now(),
      {
        cache: "no-store"
      }
    );


    if (!response.ok) {
      throw new Error(
        "matches.json introuvable"
      );
    }


    const data =
      await response.json();


    let matches = [];


    if (Array.isArray(data)) {

      matches = data;

    } else if (Array.isArray(data.matches)) {

      matches = data.matches;

    } else if (Array.isArray(data.response)) {

      matches = data.response;
    }


    statusBox.textContent =
      `${matches.length} match${matches.length !== 1 ? "s" : ""} disponible${matches.length !== 1 ? "s" : ""}`;


    if (!matches.length) {

      content.innerHTML = `
        <div class="empty">
          Aucun match disponible pour le moment.
        </div>
      `;

      return;
    }


    const live = [];
    const finished = [];
    const upcoming = [];


    matches.forEach(match => {

      const type =
        getMatchStatus(match);


      if (type === "live") {

        live.push(match);

      } else if (type === "finished") {

        finished.push(match);

      } else {

        upcoming.push(match);
      }

    });


    /*
      Tri des matchs à venir par date.
    */

    upcoming.sort(
      (a, b) =>
        new Date(getDate(a)) -
        new Date(getDate(b))
    );


    /*
      Tri des matchs terminés par date.
    */

    finished.sort(
      (a, b) =>
        new Date(getDate(b)) -
        new Date(getDate(a))
    );


    /*
      Matchs en direct.
    */

    let html = "";

    html += renderSection(
      "🔴 EN DIRECT",
      live
    );


    /*
      Matchs à venir groupés par jour.
    */

    const upcomingDays = {};

    upcoming.forEach(match => {

      const key =
        getDateKey(match);

      if (!upcomingDays[key]) {
        upcomingDays[key] = [];
      }

      upcomingDays[key].push(match);

    });


    Object.keys(upcomingDays)
      .sort()
      .forEach(key => {

        html += renderSection(
          `🕐 À VENIR — ${getDayLabel(key)}`,
          upcomingDays[key]
        );

      });


    /*
      Matchs terminés.
    */

    html += renderSection(
      "✅ TERMINÉS",
      finished
    );


    if (!html) {

      html = `
        <div class="empty">
          Aucun match à afficher.
        </div>
      `;
    }


    content.innerHTML = html;


  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "Erreur de chargement";

    content.innerHTML = `

      <div class="error">

        ❌ Impossible de charger les matchs.

        <br><br>

        Vérifie que
        <strong>matches.json</strong>
        est bien présent dans le dépôt.

      </div>

    `;
  }
}


/*
  Chargement initial.
*/

loadMatches();


/*
  Actualisation toutes les 5 minutes.
*/

setInterval(
  loadMatches,
  300000
);
  </script>
<!-- LECTEUR FOOTBALL LIVE -->
<div id="videoPlayer" style="
  display:none;
  margin:20px auto;
  max-width:900px;
  padding:15px;
  background:#111;
  border-radius:12px;
">

  <h2 id="matchTitle">Match en direct</h2>

  <video
    id="player"
    controls
    playsinline
    style="
      width:100%;
      background:#000;
      border-radius:10px;
    ">
  </video>

  <p id="playerMessage">
    La diffusion officielle n'est pas encore disponible.
  </p>
</div>

<script>
function regarderMatch(match) {
  const videoPlayer = document.getElementById("videoPlayer");
  const player = document.getElementById("player");
  const matchTitle = document.getElementById("matchTitle");
  const playerMessage = document.getElementById("playerMessage");

  videoPlayer.style.display = "block";

  matchTitle.textContent =
    match.homeTeam + " - " + match.awayTeam;

  if (!match.streamUrl) {
    player.removeAttribute("src");
    playerMessage.textContent =
      "La diffusion officielle n'est pas encore disponible pour ce match.";
    return;
  }

  playerMessage.textContent = "";
  player.src = match.streamUrl;
  player.load();
  player.play().catch(() => {});
}
</script>

</body>
  </html>
