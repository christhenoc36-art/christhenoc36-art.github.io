je<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOOTBALL LIVE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #081220;
  color: white;
}

header {
  background: #111c33;
  padding: 25px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  color: #b8c4d9;
  font-size: 18px;
}

#matches {
  padding: 20px;
  max-width: 700px;
  margin: auto;
}

.match {
  background: #172642;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.25);
}

.competition {
  color: #9fb0cc;
  font-size: 14px;
  margin-bottom: 12px;
}

.teams {
  font-size: 20px;
  font-weight: bold;
}

.score {
  font-size: 32px;
  margin: 15px 0;
}

.status {
  color: #35e879;
  font-weight: bold;
}

.date {
  color: #aebbd0;
  margin-top: 10px;
}

.loading {
  text-align: center;
  padding: 40px;
  font-size: 18px;
}

.error {
  text-align: center;
  color: #ff6b6b;
  padding: 30px;
}

footer {
  text-align: center;
  color: #7f8da8;
  padding: 30px;
}
</style>
</head>

<body>

<header>
  <h1>⚽ FOOTBALL LIVE</h1>
  <p>Matchs et scores en direct</p>
</header>

<div id="matches">
  <div class="loading">⏳ Chargement des matchs...</div>
</div>

<footer>
  © 2026 FOOTBALL LIVE
</footer>

<script>
async function chargerMatchs() {

  const container = document.getElementById("matches");

  try {

    const response = await fetch("matches.json?cache=" + Date.now());

    if (!response.ok) {
      throw new Error("Impossible de charger les matchs");
    }

    const data = await response.json();

    container.innerHTML = "";

    if (!data.matches || data.matches.length === 0) {
      container.innerHTML =
        '<div class="loading">Aucun match disponible.</div>';
      return;
    }

    data.matches.forEach(match => {

      const home =
        match.homeTeam?.name || "Équipe A";

      const away =
        match.awayTeam?.name || "Équipe B";

      const homeScore =
        match.score?.fullTime?.home ?? 0;

      const awayScore =
        match.score?.fullTime?.away ?? 0;

      const status =
        match.status || "À VENIR";

      const competition =
        match.competition?.name || "Football";

      let date = "";

      if (match.utcDate) {
        date = new Date(match.utcDate).toLocaleString("fr-FR", {
          dateStyle: "short",
          timeStyle: "short"
        });
      }

      const card = document.createElement("div");

      card.className = "match";

      card.innerHTML = `
        <div class="competition">
          ${competition}
        </div>

        <div class="teams">
          ${home} 🆚 ${away}
        </div>

        <div class="score">
          ${homeScore} - ${awayScore}
        </div>

        <div class="status">
          ${traduireStatut(status)}
        </div>

        <div class="date">
          ${date}
        </div>
      `;

      container.appendChild(card);
    });

  } catch (error) {

    container.innerHTML = `
      <div class="error">
        ❌ Impossible de charger les matchs.
      </div>
    `;

    console.error(error);
  }
}

function traduireStatut(status) {

  const statuts = {
    IN_PLAY: "🔴 EN DIRECT",
    PAUSED: "⏸️ PAUSE",
    FINISHED: "✅ TERMINÉ",
    SCHEDULED: "🕐 À VENIR",
    TIMED: "🕐 À VENIR"
  };

  return statuts[status] || status;
}

chargerMatchs();

setInterval(chargerMatchs, 60000);
</script>

</body>
</html>
<script>
async function chargerMatchs() {
  try {
    const response = await fetch("matches.json");
    const data = await response.json();

    const matchs = data.matches || [];

    const section = document.createElement("section");
    section.innerHTML = "<h2>⚽ Matchs en direct</h2>";

    matchs.forEach(match => {
      const home = match.homeTeam?.name || "Équipe A";
      const away = match.awayTeam?.name || "Équipe B";
      const scoreHome = match.score?.fullTime?.home ?? 0;
      const scoreAway = match.score?.fullTime?.away ?? 0;

      const carte = document.createElement("div");
      carte.style.cssText =
        "background:#111c33;padding:20px;margin:15px;border-radius:15px;";

      carte.innerHTML = `
        <h3>${home} 🆚 ${away}</h3>
        <div style="font-size:30px">${scoreHome} - ${scoreAway}</div>
      `;

      section.appendChild(carte);
    });

    document.body.appendChild(section);

  } catch (erreur) {
    console.log("Erreur :", erreur);
  }
}

chargerMatchs();
</script>
<script>
fetch("matches.json")
.then(r=>r.json())
.then(d=>document.body.innerHTML += "<h2>⚽ Matchs : "+d.matches.length+"</h2>");
</script>
