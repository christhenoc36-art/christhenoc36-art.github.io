<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOOTBALL LIVE</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#07111f;
color:#fff;
padding-bottom:75px
}

header{
background:linear-gradient(135deg,#101d32,#172d4d);
padding:24px 15px;
text-align:center
}

.logo{font-size:30px;font-weight:800}
.logo span{color:#39e878}

.subtitle{
color:#aebbd0;
margin:7px 0 18px
}

.search{
max-width:650px;
margin:auto
}

.search input{
width:100%;
padding:14px 17px;
border:0;
border-radius:14px;
font-size:16px;
outline:none
}

main{
max-width:750px;
margin:auto;
padding:18px 15px
}

.hero{
background:#111f35;
border-radius:20px;
padding:20px;
margin-bottom:18px
}

.hero h2{margin:0 0 8px}
.hero p{color:#aebbd0;margin:0}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin:18px 0
}

.stat{
background:#111f35;
border-radius:15px;
padding:15px 8px;
text-align:center
}

.stat strong{
display:block;
font-size:24px
}

.stat span{
color:#9eabc0;
font-size:12px
}

.section-title{
display:flex;
justify-content:space-between;
align-items:center;
margin:22px 0 12px
}

.section-title h2{
margin:0;
font-size:20px
}

.match{
background:#111f35;
border-radius:18px;
padding:17px;
margin:12px 0;
cursor:pointer
}

.competition{
color:#9eabc0;
font-size:13px;
margin-bottom:14px
}

.teams{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
text-align:center
}

.team{
width:40%;
font-weight:bold;
line-height:1.35
}

.team img{
width:52px;
height:52px;
object-fit:contain;
display:block;
margin:0 auto 7px
}

.vs{
color:#718096;
font-size:13px;
font-weight:bold
}

.score{
text-align:center;
font-size:29px;
font-weight:800;
margin:13px 0 8px
}

.status{
text-align:center;
font-weight:bold
}

.live{color:#ff4d4d}
.upcoming{color:#4da3ff}
.finished{color:#39e878}

.date{
text-align:center;
color:#7f8da3;
font-size:12px;
margin-top:9px
}

.favorite{
float:right;
border:0;
background:none;
color:#ffd166;
font-size:23px
}

.message{
text-align:center;
padding:35px 10px;
color:#aebbd0
}

.competition-card{
background:#111f35;
border-radius:18px;
padding:18px;
margin:12px 0;
cursor:pointer
}

.competition-card h3{
margin:0 0 8px
}

.competition-card p{
color:#9eabc0;
margin:5px 0
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
background:#101d32;
display:flex;
justify-content:space-around;
align-items:center;
z-index:20;
border-top:1px solid #203451
}

.bottom-nav button{
background:none;
border:0;
color:#8f9db2;
font-size:11px
}

.bottom-nav button.active{
color:#39e878
}

.bottom-nav div{
font-size:21px
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
z-index:50;
padding:15px;
overflow:auto
}

.modal-box{
background:#111f35;
max-width:650px;
margin:25px auto;
padding:22px;
border-radius:20px
}

.close{
float:right;
border:0;
background:#263752;
color:#fff;
border-radius:50%;
width:35px;
height:35px;
font-size:20px
}

.detail-teams{
display:flex;
justify-content:space-around;
align-items:center;
text-align:center;
margin-top:35px
}

.detail-team{
width:40%;
font-weight:bold
}

.detail-team img{
width:70px;
height:70px;
object-fit:contain
}

.detail-score{
font-size:36px;
font-weight:800
}

.info-box{
background:#172642;
border-radius:15px;
padding:15px;
margin-top:18px
}

.info-box h3{
margin-top:0
}

.goal,
.card-row,
.sub-row{
padding:9px 0;
border-bottom:1px solid #2a3d59
}

.goal:last-child,
.card-row:last-child,
.sub-row:last-child{
border-bottom:0
}

.small{
color:#9eabc0;
font-size:13px
}
</style>
</head>

<body>

<header>

<div class="logo">
⚽ FOOTBALL <span>LIVE</span>
</div>

<div class="subtitle">
Toute l'actualité du football en direct
</div>

<div class="search">
<input
id="search"
type="search"
placeholder="🔎 Rechercher une équipe..."
>
</div>

</header>

<main id="app"></main>

<nav class="bottom-nav">

<button id="navHome"
class="active"
onclick="pageAccueil()">
<div>🏠</div>
Accueil
</button>

<button id="navLive"
onclick="pageLive()">
<div>🔴</div>
Live
</button>

<button id="navCompetitions"
onclick="pageCompetitions()">
<div>🏆</div>
Compétitions
</button>

<button id="navFavorites"
onclick="pageFavoris()">
<div>⭐</div>
Favoris
</button>

</nav>

<div class="modal" id="modal">

<div class="modal-box">

<button class="close" onclick="fermerDetail()">×</button>

<div id="detail"></div>

</div>

</div>

<script>

let matchs=[];
let pageActuelle="home";

let favoris=JSON.parse(
localStorage.getItem("favorisFootball") || "[]"
);


function statutFrancais(statut){

const t={
IN_PLAY:"🔴 EN DIRECT",
PAUSED:"⏸️ PAUSE",
FINISHED:"✅ TERMINÉ",
SCHEDULED:"🕐 À VENIR",
TIMED:"🕐 À VENIR",
POSTPONED:"⏸️ REPORTÉ",
CANCELLED:"❌ ANNULÉ",
SUSPENDED:"⚠️ SUSPENDU"
};

return t[statut] || "🕐 À VENIR";
}


function categorie(statut){

if(statut==="IN_PLAY" || statut==="PAUSED")
return "live";

if(statut==="FINISHED")
return "finished";

return "upcoming";
}


function dateFr(date){

if(!date)return "";

return new Date(date).toLocaleString(
"fr-FR",
{
dateStyle:"short",
timeStyle:"short"
}
);
}


function navigation(active){

document
.querySelectorAll(".bottom-nav button")
.forEach(b=>b.classList.remove("active"));

document
.getElementById(active)
.classList.add("active");
}


function pageAccueil(){

pageActuelle="home";
navigation("navHome");

afficherAccueil();
}


function pageLive(){

pageActuelle="live";
navigation("navLive");

afficherListeLive();
}


function pageCompetitions(){

pageActuelle="competitions";
navigation("navCompetitions");

afficherCompetitions();
}


function pageFavoris(){

pageActuelle="favorites";
navigation("navFavorites");

afficherFavoris();
}


function afficherAccueil(){

const live=matchs.filter(
m=>categorie(m.status)==="live"
);

const prochains=matchs.filter(
m=>categorie(m.status)==="upcoming"
);

const termines=matchs.filter(
m=>categorie(m.status)==="finished"
);

document.getElementById("app").innerHTML=`

<section class="hero">

<h2>🔥 Bienvenue sur FOOTBALL LIVE</h2>

<p>
Suivez les matchs, scores, buteurs
et événements du football.
</p>

</section>

<section class="stats">

<div class="stat">
<strong>${matchs.length}</strong>
<span>Matchs</span>
</div>

<div class="stat">
<strong>${live.length}</strong>
<span>En direct</span>
</div>

<div class="stat">
<strong>${termines.length}</strong>
<span>Terminés</span>
</div>

</section>

<div class="section-title">
<h2>🔴 En direct</h2>
</div>

<div id="homeLive"></div>

<div class="section-title">
<h2>📅 Prochains matchs</h2>
</div>

<div id="homeUpcoming"></div>

`;

afficherPetiteListe(
live.slice(0,5),
"homeLive"
);

afficherPetiteListe(
prochains.slice(0,5),
"homeUpcoming"
);
}


function afficherPetiteListe(liste,id){

const zone=document.getElementById(id);

if(!liste.length){

zone.innerHTML=`
<div class="message">
Aucun match dans cette catégorie.
</div>
`;

return;
}

zone.innerHTML="";

liste.forEach(match=>{
zone.appendChild(creerCarte(match));
});

}


function afficherListeLive(){

const liste=matchs.filter(
m=>categorie(m.status)==="live"
);

document.getElementById("app").innerHTML=`

<div class="section-title">
<h2>🔴 Matchs en direct</h2>
</div>

<div id="liste"></div>

`;

const zone=document.getElementById("liste");

if(!liste.length){

zone.innerHTML=`
<div class="message">
⚽ Aucun match en direct.
</div>
`;

return;
}

liste.forEach(match=>{
zone.appendChild(creerCarte(match));
});

}


function creerCarte(match){

const home=match.homeTeam?.name ||
"Équipe domicile";

const away=match.awayTeam?.name ||
"Équipe extérieure";

const homeLogo=match.homeTeam?.crest || "";
const awayLogo=match.awayTeam?.crest || "";

const homeScore=
match.score?.fullTime?.home ?? "-";

const awayScore=
match.score?.fullTime?.away ?? "-";

const status=
match.status || "SCHEDULED";

const cat=categorie(status);

const competition=
match.competition?.name || "Football";

const id=String(
match.id ||
home+"-"+away
);

const star=
favoris.includes(id) ? "★" : "☆";

const card=document.createElement("article");

card.className="match";

card.innerHTML=`

<button
class="favorite"
onclick="event.stopPropagation();
basculerFavori('${id}')">
${star}
</button>

<div class="competition">
🏆 ${competition}
</div>

<div class="teams">

<div class="team">

${
homeLogo
? `<img src="${homeLogo}" alt="">`
: "⚽"
}

${home}

</div>

<div class="vs">
VS
</div>

<div class="team">

${
awayLogo
? `<img src="${awayLogo}" alt="">`
: "⚽"
}

${away}

</div>

</div>

<div class="score">
${homeScore} - ${awayScore}
</div>

<div class="status ${cat}">
${statutFrancais(status)}
</div>

<div class="date">
${dateFr(match.utcDate)}
</div>

`;

card.onclick=()=>{
ouvrirDetail(match);
};

return card;
}


function afficherCompetitions(){

const groupes={};

matchs.forEach(match=>{

const nom=
match.competition?.name || "Football";

if(!groupes[nom])
groupes[nom]=0;

groupes[nom]++;

});

document.getElementById("app").innerHTML=`

<div class="section-title">
<h2>🏆 Compétitions</h2>
</div>

<div id="competitions"></div>

`;

const zone=
document.getElementById("competitions");

const noms=Object.keys(groupes);

if(!noms.length){

zone.innerHTML=`
<div class="message">
Aucune compétition disponible.
</div>
`;

return;
}

noms.forEach(nom=>{

const card=
document.createElement("div");

card.className="competition-card";

card.innerHTML=`

<h3>🏆 ${nom}</h3>

<p>
${groupes[nom]} match(s)
</p>

`;

card.onclick=()=>{
afficherCompetition(nom);
};

zone.appendChild(card);

});

}


function afficherCompetition(nom){

const liste=matchs.filter(
m=>
(m.competition?.name || "Football")
===nom
);

document.getElementById("app").innerHTML=`

<div class="section-title">
<h2>🏆 ${nom}</h2>
</div>

<div id="competitionMatches"></div>

`;

const zone=
document.getElementById(
"competitionMatches"
);

liste.forEach(match=>{
zone.appendChild(creerCarte(match));
});

}


function afficherFavoris(){

const liste=matchs.filter(match=>{

const id=String(
match.id ||
(match.homeTeam?.name || "")+
"-"+
(match.awayTeam?.name || "")
);

return favoris.includes(id);

});

document.getElementById("app").innerHTML=`

<div class="section-title">
<h2>⭐ Mes favoris</h2>
</div>

<div id="favoris"></div>

`;

const zone=
document.getElementById("favoris");

if(!liste.length){

zone.innerHTML=`

<div class="message">

⭐ Aucun favori pour le moment.

<br><br>

Appuie sur ☆ sur un match
pour l'ajouter.

</div>

`;

return;
}

liste.forEach(match=>{
zone.appendChild(creerCarte(match));
});

}


function basculerFavori(id){

const index=
favoris.indexOf(id);

if(index>=0)
favoris.splice(index,1);
else
favoris.push(id);

localStorage.setItem(
"favorisFootball",
JSON.stringify(favoris)
);

rafraichirPage();
}


function rafraichirPage(){

if(pageActuelle==="home")
afficherAccueil();

else if(pageActuelle==="live")
afficherListeLive();

else if(pageActuelle==="competitions")
afficherCompetitions();

else if(pageActuelle==="favorites")
afficherFavoris();

}


function obtenirButeurs(match){

return match.goals || [];
}


function obtenirCartons(match){

return match.bookings || [];
}


function obtenirRemplacements(match){

return match.substitutions || [];
}


function afficherButeurs(match){

const goals=
obtenirButeurs(match);

if(!goals.length){

return `
<div class="info-box">

<h3>⚽ Buteurs</h3>

<p class="small">
Aucun but enregistré pour ce match.
</p>

</div>
`;

}

let html=`

<div class="info-box">

<h3>⚽ Buteurs</h3>

`;

goals.forEach(goal=>{

const joueur=
goal.scorer?.name ||
goal.player?.name ||
"Joueur";

const minute=
goal.minute ??
goal.timing?.minute ??
"";

const equipe=
goal.team?.name || "";

const type=
goal.type || "";

html+=`

<div class="goal">

<strong>
${minute ? minute+"′ " : ""}
${joueur}
</strong>

<div class="small">
${equipe}
${type ? " • "+type : ""}
</div>

</div>

`;

});

html+=`</div>`;

return html;
}


function afficherCartons(match){

const bookings=
obtenirCartons(match);

if(!bookings.length)
return "";

let html=`

<div class="info-box">

<h3>🟨 Cartons</h3>

`;

bookings.forEach(item=>{

const joueur=
item.player?.name ||
item.player?.firstName ||
"Joueur";

const minute=
item.minute ??
item.timing?.minute ??
"";

const type=
item.card ||
item.type ||
"Carton";

html+=`

<div class="card-row">

${minute ? minute+"′ " : ""}
${type} — ${joueur}

</div>

`;

});

html+=`</div>`;

return html;
}


function afficherRemplacements(match){

const subs=
obtenirRemplacements(match);

if(!subs.length)
return "";

let html=`

<div class="info-box">

<h3>🔄 Remplacements</h3>

`;

subs.forEach(item=>{

const entrant=
item.playerIn?.name ||
item.playerIn?.player?.name ||
"Entrant";

const sortant=
item.playerOut?.name ||
item.playerOut?.player?.name ||
"Sortant";

const minute=
item.minute ??
item.timing?.minute ??
"";

html+=`

<div class="sub-row">

${minute ? minute+"′ " : ""}

⬆️ ${entrant}

<br>

<span class="small">
⬇️ ${sortant}
</span>

</div>

`;

});

html+=`</div>`;

return html;
}


function afficherCompositions(match){

const homeLineup=
match.homeTeam?.lineup ||
match.lineups?.find(
x=>x.team?.id===match.homeTeam?.id
);

const awayLineup=
match.awayTeam?.lineup ||
match.lineups?.find(
x=>x.team?.id===match.awayTeam?.id
);

if(!homeLineup && !awayLineup)
return "";

function joueurs(lineup){

if(!lineup?.startXI)
return "";

return lineup.startXI
.map(x=>x.player?.name || x.name || "")
.filter(Boolean)
.join(", ");
}

return `

<div class="info-box">

<h3>👥 Compositions</h3>

<p>
<strong>
${match.homeTeam?.name || "Domicile"}
</strong>
<br>
<span class="small">
${joueurs(homeLineup)}
</span>
</p>

<p>
<strong>
${match.awayTeam?.name || "Extérieur"}
</strong>
<br>
<span class="small">
${joueurs(awayLineup)}
</span>
</p>

</div>

`;
}


function ouvrirDetail(match){

const home=
match.homeTeam?.name ||
"Équipe domicile";

const away=
match.awayTeam?.name ||
"Équipe extérieure";

const homeLogo=
match.homeTeam?.crest || "";

const awayLogo=
match.awayTeam?.crest || "";

const homeScore=
match.score?.fullTime?.home ?? "-";

const awayScore=
match.score?.fullTime?.away ?? "-";

const competition=
match.competition?.name ||
"Football";

document.getElementById("detail").innerHTML=`

<h2>🏆 ${competition}</h2>

<div class="detail-teams">

<div class="detail-team">

${
homeLogo
? `<img src="${homeLogo}" alt="">`
: "⚽"
}

<p>${home}</p>

</div>

<div>

<div class="detail-score">
${homeScore} - ${awayScore}
</div>

<p>
${statutFrancais(
match.status || "SCHEDULED"
)}
</p>

</div>

<div class="detail-team">

${
awayLogo
? `<img src="${awayLogo}" alt="">`
: "⚽"
}

<p>${away}</p>

</div>

</div>

<p>
🕐 ${dateFr(match.utcDate)}
</p>

${afficherButeurs(match)}

${afficherCartons(match)}

${afficherRemplacements(match)}

${afficherCompositions(match)}

`;

document.getElementById("modal")
.style.display="block";
}


function fermerDetail(){

document.getElementById("modal")
.style.display="none";
}


document.getElementById("search")
.addEventListener(
"input",
function(){

const recherche=
this.value.toLowerCase().trim();

if(recherche===""){

rafraichirPage();

return;
}

const resultats=
matchs.filter(match=>{

const home=
match.homeTeam?.name || "";

const away=
match.awayTeam?.name || "";

return(
(home+" "+away)
.toLowerCase()
.includes(recherche)
);

});

document.getElementById("app").innerHTML=`

<div class="section-title">
<h2>🔎 Recherche</h2>
</div>

<div id="searchResults"></div>

`;

const zone=
document.getElementById(
"searchResults"
);

if(!resultats.length){

zone.innerHTML=`
<div class="message">
Aucune équipe trouvée.
</div>
`;

return;
}

resultats.forEach(match=>{
zone.appendChild(creerCarte(match));
});

});


async function chargerMatchs(){

try{

const response=
await fetch(
"matches.json?cache="+Date.now()
);

if(!response.ok)
throw new Error();

const data=
await response.json();

matchs=data.matches || [];

rafraichirPage();

}catch(error){

document.getElementById("app")
.innerHTML=`

<div class="message">

❌ Impossible de charger les matchs.

</div>

`;

}

}


chargerMatchs();

setInterval(
chargerMatchs,
60000
);

</script>

</body>
  </html>
