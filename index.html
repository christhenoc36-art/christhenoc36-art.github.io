<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Football Live</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
    }

    header {
      padding: 22px;
      background: linear-gradient(135deg, #087f5b, #0875c9);
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      color: #dcecff;
    }

    nav {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #101a2d;
      overflow-x: auto;
    }

    nav button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      background: #1d2b43;
      color: white;
      white-space: nowrap;
    }

    nav button.active {
      background: #22c55e;
      color: #06140b;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }

    .info {
      background: #111b2e;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 18px;
    }

    .info h2 {
      margin-top: 0;
    }

    .muted {
      color: #aab6c8;
    }

    .card {
      background: #111b2e;
      border-radius: 17px;
      padding: 17px;
      margin: 13px 0;
      border: 1px solid #1f3049;
    }

    .league {
      color: #60a5fa;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .team {
      width: 40%;
      text-align: center;
      font-weight: bold;
    }

    .team img {
      width: 55px;
      height: 55px;
      object-fit: contain;
      display: block;
      margin: 0 auto 8px;
    }

    .vs {
      text-align: center;
      width: 20%;
    }

    .score {
      font-size: 23px;
      font-weight: bold;
      margin-top: 5px;
    }

    .status {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 20px;
      background: #334155;
      font-size: 12px;
    }

    .status.live {
      background: #dc2626;
      color: white;
    }

    .date {
      text-align: center;
      color: #94a3b8;
      margin-top: 14px;
      font-size: 13px;
    }

    .loading,
    .error,
    .empty {
      background: #111b2e;
      border-radius: 15px;
      padding: 22px;
      text-align: center;
      margin-top: 15px;
    }

    .error {
      border: 1px solid #dc2626;
    }

    .refresh {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      background: #0ea5e9;
      color: white;
      font-weight: bold;
      margin-top: 12px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #718096;
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ Football <span>LIVE</span></h1>
  <p>Les vrais matchs, scores et résultats en direct</p>
</header>

<nav>
  <button class="active" onclick="filterMatches('Tous', this)">
    Tous
  </button>

  <button onclick="filterMatches('En direct', this)">
    🔴 En direct
  </button>

  <button onclick="filterMatches('À venir', this)">
    📅 À venir
  </button>

  <button onclick="filterMatches('Terminés', this)">
    ✅ Terminés
  </button>
</nav>

<main>

  <section class="info">
    <h2>⚡ Matchs du jour</h2>
    <div class="muted">
      Les matchs sont récupérés automatiquement depuis l'API Football.
    </div>

    <button class="refresh" onclick="loadMatches()">
      🔄 Actualiser les matchs
    </button>
  </section>

  <section id="games">

    <div class="loading">
      ⏳ Chargement des vrais matchs...
    </div>

  </section>

</main>

<footer>
  Football Live © 2026
</footer>


<script>

  /* =========================
     VARIABLES
  ========================= */

  let games = [];

  let currentFilter = "Tous";


  /* =========================
     CHARGER LES MATCHS
  ========================= */

  async function loadMatches() {

    const box = document.getElementById("games");

    box.innerHTML = `
      <div class="loading">
        ⏳ Chargement des vrais matchs...
      </div>
    `;

    try {

      /*
        On appelle ton fichier :
        api/matches.js

        Sur Vercel il devient :
        /api/matches
      */

      const response = await fetch("/api/matches");

      if (!response.ok) {
        throw new Error("Erreur serveur : " + response.status);
      }

      const data = await response.json();

      console.log("Réponse API :", data);


      /* =========================
         VÉRIFICATION
      ========================= */

      if (!data.response) {

        throw new Error(
          data.message || "Réponse API invalide"
        );

      }


      /* =========================
         TRANSFORMATION DES MATCHS
      ========================= */

      games = data.response.map(match => {

        const shortStatus =
          match.fixture?.status?.short || "NS";


        let status = "À venir";


        if (
          [
            "1H",
            "2H",
            "HT",
            "ET",
            "P",
            "LIVE",
            "INT"
          ].includes(shortStatus)
        ) {

          status = "En direct";

        }


        else if (
          [
            "FT",
            "AET",
            "PEN"
          ].includes(shortStatus)
        ) {

          status = "Terminés";

        }


        let score = "—";


        if (
          match.goals?.home !== null &&
          match.goals?.home !== undefined &&
          match.goals?.away !== null &&
          match.goals?.away !== undefined
        ) {

          score =
            match.goals.home +
            " - " +
            match.goals.away;

        }


        return {

          league:
            match.league?.name ||
            "Football",

          home:
            match.teams?.home?.name ||
            "Équipe domicile",

          away:
            match.teams?.away?.name ||
            "Équipe extérieure",

          homeLogo:
            match.teams?.home?.logo ||
            "",

          awayLogo:
            match.teams?.away?.logo ||
            "",

          score: score,

          status: status,

          date:
            match.fixture?.date ||
            ""

        };

      });


      renderMatches();


    }

    catch (error) {

      console.error(
        "Erreur chargement matchs :",
        error
      );


      box.innerHTML = `

        <div class="error">

          ❌ Impossible de charger les matchs.

          <br><br>

          Vérifie que :

          <br>

          • <b>api/matches.js</b> existe

          <br>

          • <b>football_api_key</b> existe dans Vercel

          <br>

          • le projet est bien déployé sur Vercel

        </div>

      `;

    }

  }


  /* =========================
     AFFICHER LES MATCHS
  ========================= */

  function renderMatches() {

    const box =
      document.getElementById("games");


    const filtered =
      games.filter(match => {

        return (
          currentFilter === "Tous" ||
          match.status === currentFilter
        );

      });


    if (filtered.length === 0) {

      box.innerHTML = `

        <div class="empty">

          Aucun match trouvé pour cette catégorie.

        </div>

      `;

      return;

    }


    box.innerHTML =
      filtered.map(match => {

        const homeLogo =
          match.homeLogo
            ? `
              <img
                src="${escapeHTML(match.homeLogo)}"
                alt=""
                onerror="this.style.display='none'"
              >
            `
            : "⚽";


        const awayLogo =
          match.awayLogo
            ? `
              <img
                src="${escapeHTML(match.awayLogo)}"
                alt=""
                onerror="this.style.display='none'"
              >
            `
            : "⚽";


        const liveClass =
          match.status === "En direct"
            ? "live"
            : "";


        return `

          <article class="card">

            <div class="league">

              🏆
              ${escapeHTML(match.league)}

            </div>


            <div class="teams">


              <div class="team">

                ${homeLogo}

                <div>
                  ${escapeHTML(match.home)}
                </div>

              </div>


              <div class="vs">

                <span
                  class="status ${liveClass}"
                >
                  ${match.status}
                </span>

                <div class="score">

                  ${escapeHTML(match.score)}

                </div>

              </div>


              <div class="team">

                ${awayLogo}

                <div>
                  ${escapeHTML(match.away)}
                </div>

              </div>


            </div>


            <div class="date">

              ${formatDate(match.date)}

            </div>

          </article>

        `;

      }).join("");

  }


  /* =========================
     FILTRES
  ========================= */

  function filterMatches(
    filter,
    button
  ) {

    currentFilter = filter;


    document
      .querySelectorAll("nav button")
      .forEach(btn => {

        btn.classList.remove("active");

      });


    button.classList.add("active");


    renderMatches();

  }


  /* =========================
     DATE
  ========================= */

  function formatDate(date) {

    if (!date) {
      return "";
    }


    const d = new Date(date);


    if (isNaN(d)) {
      return "";
    }


    return d.toLocaleString(
      "fr-FR",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  }


  /* =========================
     SÉCURITÉ HTML
  ========================= */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(
        /[&<>"']/g,
        character => ({

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[character])
      );

  }


  /* =========================
     PREMIER CHARGEMENT
  ========================= */

  loadMatches();


  /* =========================
     ACTUALISATION AUTOMATIQUE
     TOUTES LES 60 SECONDES
  ========================= */

  setInterval(
    loadMatches,
    60000
  );

</script>

</body>
    </html>
