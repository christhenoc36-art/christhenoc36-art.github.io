<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOOTBALL LIVE</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #081220;
  color: white;
}

header {
  background: #111c33;
  padding: 25px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  color: #b8c4d9;
}

#matches {
  padding: 20px;
  max-width: 650px;
  margin: auto;
}

.match {
  background: #172642;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 16px;
  text-align: center;
}

.equipes {
  font-size: 20px;
  font-weight: bold;
}

.score {
  font-size: 32px;
  font-weight: bold;
  margin: 15px;
}

.statut {
  font-weight: bold;
  color: #35e879;
}

.message {
  text-align: center;
  padding: 30px;
}

footer {
  text-align: center;
  color: #8795ad;
  padding: 25px;
}
</style>
</head>

<body>

<header>
  <h1>⚽ FOOTBALL LIVE</h1>
  <p>Matchs et scores de football</p>
</header>

<div id="matches">
  <div class="message">⏳ Chargement des matchs...</div>
</div>

<footer>
  © 2026 FOOTBALL LIVE
</footer>

<script>
function traduireStatut(statut) {
  const traductions = {
    "IN_PLAY": "🔴 EN DIRECT",
    "PAUSED": "⏸️ PAUSE",
    "FINISHED": "✅ TERMINÉ",
    "SCHEDULED": "🕐 À VENIR",
    "TIMED": "🕐 À VENIR",
    "POSTPONED": "⏸️ REPORTÉ",
    "CANCELLED": "❌ ANNULÉ",
    "SUSPENDED": "⚠️ SUSPENDU"
  };

  return traductions[statut] || "🕐 À VENIR";
}

fetch("matches.json?cache=" + Date.now())
  .then(response => response.json())
  .then(data => {

    const container = document.getElementById("matches");

    if (!data.matches || data.matches.length === 0) {
      container.innerHTML =
        '<div class="message">⚽ Aucun match disponible.</div>';
      return;
    }

    container.innerHTML = "";

    data.matches.forEach(match => {

      const domicile =
        match.homeTeam?.name || "Équipe domicile";

      const exterieur =
        match.awayTeam?.name || "Équipe extérieure";

      const scoreDomicile =
        match.score?.fullTime?.home ?? "-";

      const scoreExterieur =
        match.score?.fullTime?.away ?? "-";

      const statut =
        traduireStatut(match.status);

      container.innerHTML += `
        <div class="match">

          <div class="equipes">
            ${domicile}
            🆚
            ${exterieur}
          </div>

          <div class="score">
            ${scoreDomicile} - ${scoreExterieur}
          </div>

          <div class="statut">
            ${statut}
          </div>

        </div>
      `;
    });

  })
  .catch(() => {

    document.getElementById("matches").innerHTML =
      '<div class="message">❌ Impossible de charger les matchs.</div>';

  });
</script>

</body>
  </html>
