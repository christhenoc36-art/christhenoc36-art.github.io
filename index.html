
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOOTBALL LIVE</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#081220;
  color:white;
}

header{
  background:#0d1b2a;
  padding:18px 15px;
  text-align:center;
  border-bottom:1px solid #243447;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:6px 0 0;
  color:#9fb3c8;
  font-size:13px;
}

nav{
  display:flex;
  gap:8px;
  padding:12px;
  background:#0b1725;
  position:sticky;
  top:0;
  z-index:10;
}

nav button{
  flex:1;
  border:0;
  border-radius:10px;
  padding:12px 8px;
  background:#16283b;
  color:white;
  font-weight:bold;
  font-size:14px;
}

nav button.active{
  background:#16a34a;
}

.container{
  padding:15px;
  max-width:700px;
  margin:auto;
}

.section-title{
  font-size:19px;
  font-weight:bold;
  margin:8px 0 14px;
}

.card{
  background:#101f30;
  border:1px solid #24384d;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
}

.competition{
  color:#6ee7a0;
  font-size:13px;
  margin-bottom:10px;
  font-weight:bold;
}

.date{
  color:#9fb3c8;
  font-size:12px;
  margin-bottom:12px;
}

.teams{
  display:grid;
  grid-template-columns:1fr 70px 1fr;
  align-items:center;
  text-align:center;
  gap:8px;
}

.team{
  font-weight:bold;
  font-size:14px;
}

.score{
  font-size:21px;
  font-weight:bold;
}

.status{
  text-align:center;
  color:#facc15;
  font-size:12px;
  margin-top:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#101f30;
  border-radius:14px;
  overflow:hidden;
}

th,td{
  padding:11px 6px;
  border-bottom:1px solid #24384d;
  text-align:center;
  font-size:12px;
}

th{
  background:#16283b;
  color:#9fb3c8;
}

td:nth-child(2){
  text-align:left;
  font-weight:bold;
}

.points{
  color:#6ee7a0;
  font-weight:bold;
}

.loading{
  text-align:center;
  padding:30px;
  color:#9fb3c8;
}

.error{
  background:#35151a;
  color:#ff9b9b;
  padding:15px;
  border-radius:10px;
  text-align:center;
}

.hidden{
  display:none;
}

.footer{
  text-align:center;
  color:#667d94;
  font-size:11px;
  padding:25px 10px;
}
</style>
</head>

<body>

<header>
  <h1>⚽ FOOTBALL LIVE</h1>
  <p>Matchs en direct • Résultats • Classement</p>
</header>

<nav>
  <button id="matchesBtn" class="active" onclick="showSection('matches')">
    ⚽ Matchs
  </button>
  <button id="standingsBtn" onclick="showSection('standings')">
    🏆 Classement
  </button>
</nav>

<main class="container">

  <section id="matches">
    <div class="section-title">Matchs</div>
    <div id="matchesList" class="loading">Chargement des matchs...</div>
  </section>

  <section id="standings" class="hidden">
    <div class="section-title">🏆 Classement</div>
    <div id="standingsList" class="loading">
      Chargement du classement...
    </div>
  </section>

</main>

<div class="footer">
  FOOTBALL LIVE • Mise à jour automatique
</div>

<script>

function showSection(section){

  document.getElementById("matches").classList.add("hidden");
  document.getElementById("standings").classList.add("hidden");

  document.getElementById("matchesBtn").classList.remove("active");
  document.getElementById("standingsBtn").classList.remove("active");

  document.getElementById(section).classList.remove("hidden");

  if(section === "matches"){
    document.getElementById("matchesBtn").classList.add("active");
  }else{
    document.getElementById("standingsBtn").classList.add("active");
  }
}


async function loadMatches(){

  const box = document.getElementById("matchesList");

  try{

    const response = await fetch("./matches.json?t=" + Date.now());

    if(!response.ok){
      throw new Error("matches.json introuvable");
    }

    const data = await response.json();

    const matches = data.matches || [];

    if(matches.length === 0){
      box.innerHTML = "<div class='loading'>Aucun match disponible.</div>";
      return;
    }

    box.innerHTML = "";

    matches.forEach(match => {

      const home = match.homeTeam?.name || "Équipe domicile";
      const away = match.awayTeam?.name || "Équipe extérieur";

      const competition =
        match.competition?.name || "Football";

      const date = match.utcDate
        ? new Date(match.utcDate).toLocaleString("fr-FR",{
            day:"2-digit",
            month:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
          })
        : "";

      const homeScore =
        match.score?.fullTime?.home ?? "-";

      const awayScore =
        match.score?.fullTime?.away ?? "-";

      let status = match.status || "";

      const statusNames = {
        SCHEDULED:"À venir",
        TIMED:"Programmé",
        IN_PLAY:"EN DIRECT",
        PAUSED:"Mi-temps",
        FINISHED:"Terminé",
        POSTPONED:"Reporté",
        CANCELLED:"Annulé",
        SUSPENDED:"Suspendu"
      };

      status = statusNames[status] || status;

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="competition">
          🏆 ${competition}
        </div>

        <div class="date">
          ${date}
        </div>

        <div class="teams">
          <div class="team">${home}</div>

          <div class="score">
            ${homeScore} - ${awayScore}
          </div>

          <div class="team">${away}</div>
        </div>

        <div class="status">
          ${status}
        </div>
      `;

      box.appendChild(card);
    });

  }catch(error){

    box.innerHTML = `
      <div class="error">
        Impossible de charger les matchs.
      </div>
    `;

    console.error(error);
  }
}


async function loadStandings(){

  const box = document.getElementById("standingsList");

  try{

    const response =
      await fetch("./standings.json?t=" + Date.now());

    if(!response.ok){
      throw new Error("standings.json introuvable");
    }

    const data = await response.json();

    let table = null;

    if(data.standings && data.standings.length){
      table = data.standings.find(
        s => s.type === "TOTAL"
      ) || data.standings[0];
    }

    const rows = table?.table || [];

    if(rows.length === 0){

      box.innerHTML = `
        <div class="error">
          Aucun classement disponible pour le moment.
        </div>
      `;

      return;
    }

    let html = `
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Équipe</th>
            <th>MJ</th>
            <th>V</th>
            <th>N</th>
            <th>D</th>
            <th>Diff</th>
            <th>Pts</th>
          </tr>
        </thead>
        <tbody>
    `;

    rows.forEach(team => {

      const position = team.position ?? "-";
      const name = team.team?.shortName ||
                   team.team?.name ||
                   "Équipe";

      const played = team.playedGames ?? 0;
      const won = team.won ?? 0;
      const draw = team.draw ?? 0;
      const lost = team.lost ?? 0;
      const diff = team.goalDifference ?? 0;
      const points = team.points ?? 0;

      html += `
        <tr>
          <td>${position}</td>
          <td>${name}</td>
          <td>${played}</td>
          <td>${won}</td>
          <td>${draw}</td>
          <td>${lost}</td>
          <td>${diff}</td>
          <td class="points">${points}</td>
        </tr>
      `;
    });

    html += `
        </tbody>
      </table>
    `;

    box.innerHTML = html;

  }catch(error){

    box.innerHTML = `
      <div class="error">
        Le classement n'est pas encore disponible.
      </div>
    `;

    console.error(error);
  }
}


loadMatches();
loadStandings();

</script>

</body>
</html>
