
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOOTBALL LIVE</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #081220;
  color: white;
}

header {
  text-align: center;
  padding: 25px;
  background: #111c33;
}

h1 {
  margin: 0;
}

#matches {
  padding: 20px;
}

.match {
  background: #172642;
  margin: 15px auto;
  padding: 20px;
  border-radius: 15px;
  max-width: 500px;
  text-align: center;
}

.score {
  font-size: 30px;
  font-weight: bold;
  margin: 15px;
}

.status {
  color: #35e879;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>⚽ FOOTBALL LIVE</h1>
  <p>Matchs et scores</p>
</header>

<div id="matches">
  Chargement des matchs...
</div>

<script>
fetch("matches.json?x=" + Date.now())
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById("matches");

    if (!data.matches || data.matches.length === 0) {
      container.innerHTML = "Aucun match disponible.";
      return;
    }

    container.innerHTML = "";

    data.matches.forEach(match => {
      const home = match.homeTeam?.name || "Équipe A";
      const away = match.awayTeam?.name || "Équipe B";
      const homeScore = match.score?.fullTime?.home ?? "-";
      const awayScore = match.score?.fullTime?.away ?? "-";
      const status = match.status || "À VENIR";

      container.innerHTML += `
        <div class="match">
          <h2>${home}</h2>
          <div class="score">${homeScore} - ${awayScore}</div>
          <h2>${away}</h2>
          <div class="status">${status}</div>
        </div>
      `;
    });
  })
  .catch(() => {
    document.getElementById("matches").innerHTML =
      "Impossible de charger les matchs.";
  });
</script>

</body>
</html>
