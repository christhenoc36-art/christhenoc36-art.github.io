<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Live</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#06101d;
  color:#fff;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#081827;
  border-bottom:1px solid #1d3147;
  padding:16px;
}

.header-inner{
  max-width:1000px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo-title{
  font-size:23px;
  font-weight:800;
}

.logo-title span{
  color:#16d96b;
}

.live-badge{
  background:#e52d3f;
  padding:7px 11px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:18px 14px 45px;
}

.hero{
  background:linear-gradient(135deg,#0d2946,#091725);
  border:1px solid #1d3c59;
  border-radius:20px;
  padding:22px;
  margin-bottom:18px;
}

.hero h1{
  margin:0 0 7px;
  font-size:28px;
}

.hero p{
  margin:0;
  color:#91a6bb;
  font-size:14px;
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:14px;
}

.filter{
  border:1px solid #263c54;
  background:#0d1d2e;
  color:#b9c8d8;
  padding:11px 15px;
  border-radius:22px;
  white-space:nowrap;
  font-weight:bold;
  cursor:pointer;
}

.filter.active{
  background:#16d96b;
  color:#03100a;
  border-color:#16d96b;
}

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.counter{
  color:#879caf;
  font-size:13px;
}

.refresh{
  border:0;
  background:#1769e8;
  color:white;
  padding:10px 15px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.competition{
  margin-bottom:16px;
  border-radius:15px;
  overflow:hidden;
  border:1px solid #1b3045;
  background:#0a1828;
}

.competition-header{
  background:#0d2236;
  padding:13px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.competition-name{
  font-size:14px;
  font-weight:bold;
}

.match-count{
  color:#8297ad;
  font-size:12px;
}

.match{
  padding:17px 13px;
  border-bottom:1px solid #192d42;
  cursor:pointer;
  transition:.2s;
}

.match:hover{
  background:#12263c;
}

.match:last-child{
  border-bottom:0;
}

.match-date{
  text-align:center;
  color:#71869d;
  font-size:11px;
  margin-bottom:14px;
}

.match-row{
  display:grid;
  grid-template-columns:1fr 100px 1fr;
  align-items:center;
  gap:8px;
}

.team{
  text-align:center;
  font-weight:bold;
  font-size:13px;
}

.logo{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:8px;
}

.team-logo{
  width:52px;
  height:52px;
  object-fit:contain;
  background:white;
  border-radius:50%;
  padding:5px;
}

.logo-placeholder{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#172b40;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:22px;
}

.score{
  text-align:center;
  font-size:24px;
  font-weight:800;
}

.status{
  margin-top:6px;
  text-align:center;
  font-size:10px;
  font-weight:bold;
}

.status.live{color:#ff4052}
.status.finished{color:#16d96b}
.status.upcoming{color:#55a9ff}

.empty,
.loading{
  background:#0d1d2e;
  border:1px solid #1d344a;
  border-radius:15px;
  padding:40px 15px;
  text-align:center;
  color:#8195aa;
}

.error{
  background:#32151c;
  border:1px solid #79313e;
  border-radius:15px;
  padding:25px 15px;
  text-align:center;
  color:#ff8d9a;
}

/* DÉTAIL DU MATCH */

#details{
  display:none;
}

.back{
  border:0;
  background:#172b40;
  color:white;
  padding:11px 16px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:15px;
}

.detail-card{
  background:linear-gradient(145deg,#0d2236,#091725);
  border:1px solid #1d3c59;
  border-radius:20px;
  padding:22px 15px;
  text-align:center;
}

.detail-competition{
  color:#55a9ff;
  font-size:14px;
  font-weight:bold;
  margin-bottom:20px;
}

.detail-date{
  color:#8195aa;
  font-size:13px;
  margin-bottom:20px;
}

.detail-teams{
  display:grid;
  grid-template-columns:1fr 100px 1fr;
  align-items:center;
  gap:8px;
}

.detail-team{
  font-weight:bold;
  font-size:14px;
}

.detail-logo{
  width:75px;
  height:75px;
  object-fit:contain;
  background:white;
  border-radius:50%;
  padding:7px;
  margin-bottom:10px;
}

.detail-score{
  font-size:32px;
  font-weight:900;
}

.detail-status{
  margin-top:8px;
  font-size:12px;
  font-weight:bold;
}

.info-box{
  margin-top:18px;
  background:#0a1828;
  border:1px solid #1b3045;
  border-radius:14px;
  padding:16px;
}

.info-row{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid #172b40;
  color:#a9bacb;
  font-size:13px;
}

.info-row:last-child{
  border-bottom:0;
}

.info-row strong{
  color:white;
}

footer{
  text-align:center;
  color:#60758b;
  font-size:11px;
  padding:20px;
}

@media(max-width:600px){

  .hero h1{
    font-size:24px;
  }

  .match-row{
    grid-template-columns:1fr 72px 1fr;
  }

  .team{
    font-size:11px;
  }

  .team-logo{
    width:44px;
    height:44px;
  }

  .score{
    font-size:20px;
  }

  .detail-teams{
    grid-template-columns:1fr 75px 1fr;
  }

  .detail-logo{
    width:58px;
    height:58px;
  }

  .detail-score{
    font-size:25px;
  }
}.tv-box{
  margin-top:18px;
  background:#0a1828;
  border:1px solid #1b3045;
  border-radius:14px;
  padding:16px;
}

.tv-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:12px;
}

.tv-option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  margin-top:8px;
  background:#10243a;
  border-radius:10px;
  border:1px solid #1d3850;
}

.tv-icon{
  font-size:22px;
}

.tv-name{
  font-weight:bold;
}

.tv-note{
  display:block;
  color:#8195aa;
  font-size:11px;
  margin-top:3px;
  }
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo-title">⚽ <span>Football</span> Live</div>
    <div class="live-badge">● LIVE</div>
  </div>
</header>

<main class="container">

  <!-- LISTE DES MATCHS -->

  <section id="home">

    <div class="hero">
      <h1>Football Live ⚽</h1>
      <p>Scores, matchs en direct et résultats</p>
    </div>

    <div class="filters">

      <button class="filter active" onclick="setFilter('all',this)">
        ⚽ Tous
      </button>

      <button class="filter" onclick="setFilter('live',this)">
        🔴 Direct
      </button>

      <button class="filter" onclick="setFilter('upcoming',this)">
        🕐 À venir
      </button>

      <button class="filter" onclick="setFilter('finished',this)">
        ✅ Terminés
      </button>

    </div>

    <div class="toolbar">

      <div id="counter" class="counter">
        Chargement...
      </div>

      <button class="refresh" onclick="loadMatches()">
        🔄 Actualiser
      </button>

    </div>

    <div id="matches">
      <div class="loading">
        ⚽ Chargement des matchs...
      </div>
    </div>

  </section>


  <!-- DÉTAIL D'UN MATCH -->

  <section id="details">

    <button class="back" onclick="showHome()">
      ← Retour aux matchs
    </button>

    <div id="detailContent"></div>

  </section>

</main>

<footer>
  Football Live • Actualisation automatique
</footer>

<script>

let matches = [];
let currentFilter = "all";

function getStatus(match){

  const status =
    String(match.status || "").toUpperCase();

  if(
    status === "LIVE" ||
    status === "IN_PLAY" ||
    status === "PAUSED"
  ){
    return "live";
  }

  if(
    status === "FINISHED" ||
    status === "AWARDED"
  ){
    return "finished";
  }

  return "upcoming";
}

function setFilter(filter,button){

  currentFilter = filter;

  document
    .querySelectorAll(".filter")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  renderMatches();
}

function formatDate(value){

  if(!value) return "Date inconnue";

  const date = new Date(value);

  if(isNaN(date.getTime())){
    return "Date inconnue";
  }

  return date.toLocaleString("fr-FR",{
    day:"2-digit",
    month:"long",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function getScore(match){

  const full =
    match.score &&
    match.score.fullTime
      ? match.score.fullTime
      : {};

  const home =
    full.home !== null &&
    full.home !== undefined
      ? full.home
      : "-";

  const away =
    full.away !== null &&
    full.away !== undefined
      ? full.away
      : "-";

  return home + " - " + away;
}

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function teamName(team){

  return (
    team.name ||
    team.shortName ||
    team.tla ||
    "Équipe"
  );
}

function teamHTML(team){

  const name = teamName(team);
  const crest = team.crest || "";

  return `

    <div class="logo">

      ${
        crest
        ?
        `<img
          class="team-logo"
          src="${crest}"
          alt=""
          onerror="this.style.display='none'"
        >`
        :
        `<div class="logo-placeholder">⚽</div>`
      }

    </div>

    <div>${escapeHTML(name)}</div>
  `;
}

function renderMatches(){

  const container =
    document.getElementById("matches");

  let filtered =
    matches.filter(match => {

      const status = getStatus(match);

      if(currentFilter === "live"){
        return status === "live";
      }

      if(currentFilter === "upcoming"){
        return status === "upcoming";
      }

      if(currentFilter === "finished"){
        return status === "finished";
      }

      return true;

    });

  document.getElementById("counter").textContent =
    filtered.length + " match(s)";

  if(filtered.length === 0){

    container.innerHTML = `
      <div class="empty">
        Aucun match dans cette catégorie.
      </div>
    `;

    return;
  }

  const groups = {};

  filtered.forEach(match => {

    const name =
      match.competition &&
      (
        match.competition.name ||
        match.competition.shortName
      )
      ||
      "Football";

    if(!groups[name]){
      groups[name] = [];
    }

    groups[name].push(match);

  });

  container.innerHTML = "";

  Object.keys(groups).forEach(competitionName => {

    const section =
      document.createElement("section");

    section.className = "competition";

    section.innerHTML = `

      <div class="competition-header">

        <div class="competition-name">
          🏆 ${escapeHTML(competitionName)}
        </div>

        <div class="match-count">
          ${groups[competitionName].length} match(s)
        </div>

      </div>

    `;

    groups[competitionName].forEach((match,index) => {

      const status = getStatus(match);

      let statusText = "🕐 À VENIR";
      let statusClass = "upcoming";

      if(status === "live"){
        statusText = "🔴 EN DIRECT";
        statusClass = "live";
      }

      if(status === "finished"){
        statusText = "✅ TERMINÉ";
        statusClass = "finished";
      }

      const home =
        match.homeTeam || {};

      const away =
        match.awayTeam || {};

      const card =
        document.createElement("div");

      card.className = "match";

      card.onclick = function(){
        openMatch(match);
      };

      card.innerHTML = `

        <div class="match-date">
          ${formatDate(match.utcDate)}
        </div>

        <div class="match-row">

          <div class="team">
            ${teamHTML(home)}
          </div>

          <div>

            <div class="score">
              ${getScore(match)}
            </div>

            <div class="status ${statusClass}">
              ${statusText}
            </div>

          </div>

          <div class="team">
            ${teamHTML(away)}
          </div>

        </div>

      `;

      section.appendChild(card);

    });

    container.appendChild(section);

  });

}

function openMatch(match){

  document.getElementById("home").style.display =
    "none";

  document.getElementById("details").style.display =
    "block";

  const home =
    match.homeTeam || {};

  const away =
    match.awayTeam || {};

  const competition =
    match.competition || {};

  const status =
    getStatus(match);

  let statusText = "🕐 À VENIR";
  let statusColor = "#55a9ff";

  if(status === "live"){
    statusText = "🔴 EN DIRECT";
    statusColor = "#ff4052";
  }

  if(status === "finished"){
    statusText = "✅ TERMINÉ";
    statusColor = "#16d96b";
  }

  const homeLogo =
    home.crest
    ?
    `<img class="detail-logo" src="${home.crest}" alt="">`
    :
    `<div class="logo-placeholder">⚽</div>`;

  const awayLogo =
    away.crest
    ?
    `<img class="detail-logo" src="${away.crest}" alt="">`
    :
    `<div class="logo-placeholder">⚽</div>`;

  document.getElementById("detailContent").innerHTML = `

    <div class="detail-card">

      <div class="detail-competition">
        🏆 ${escapeHTML(
          competition.name ||
          competition.shortName ||
          "Football"
        )}
      </div>

      <div class="detail-date">
        ${formatDate(match.utcDate)}
      </div>

      <div class="detail-teams">

        <div class="detail-team">

          ${homeLogo}

          <div>
            ${escapeHTML(teamName(home))}
          </div>

        </div>

        <div>

          <div class="detail-score">
            ${getScore(match)}
          </div>

          <div
            class="detail-status"
            style="color:${statusColor}"
          >
            ${statusText}
          </div>

        </div>

        <div class="detail-team">

          ${awayLogo}

          <div>
            ${escapeHTML(teamName(away))}
          </div>

        </div>

      </div>

      <div class="info-box">

        <div class="info-row">
          <span>Compétition</span>
          <strong>
            ${escapeHTML(
              competition.name ||
              "Football"
            )}
          </strong>
        </div>

        <div class="info-row">
          <span>Statut</span>
          <strong>${statusText}</strong>
        </div>

        <div class="info-row">
          <span>Date</span>
          <strong>${formatDate(match.utcDate)}</strong>
        </div>
<div class="info-row tv-broadcast">
  <span>📺 Diffusion TV</span>
  <strong>
    ${match.tvChannels && match.tvChannels.length
      ? match.tvChannels.join(" • ")
      : "Non disponible"}
  </strong>
</div>
      </div>

    </div>

  `;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function showHome(){

  document.getElementById("details").style.display =
    "none";

  document.getElementById("home").style.display =
    "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

async function loadMatches(){

  const container =
    document.getElementById("matches");

  const counter =
    document.getElementById("counter");

  counter.textContent =
    "Actualisation...";

  try{

    const response =
      await fetch(
        "matches.json?time=" +
        Date.now()
      );

    if(!response.ok){
      throw new Error(
        "matches.json introuvable"
      );
    }

    const data =
      await response.json();

    matches =
      Array.isArray(data)
      ? data
      : (data.matches || []);

    renderMatches();

  }catch(error){

    console.error(error);

    counter.textContent = "";

    container.innerHTML = `

      <div class="error">

        ❌ Impossible de charger les matchs.

        <br><br>

        Vérifie que
        <b>matches.json</b>
        est bien présent dans ton dépôt.

      </div>

    `;

  }

}

loadMatches();

setInterval(
  loadMatches,
  60000
);

</script>

</body>
  </html>
