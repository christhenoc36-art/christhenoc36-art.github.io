<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Live</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#06101d;
  color:#fff;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#081827;
  border-bottom:1px solid #1d3147;
  padding:16px;
}

.header-inner{
  max-width:1000px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:23px;
  font-weight:800;
}

.logo span{
  color:#16d96b;
}

.live-badge{
  background:#e52d3f;
  padding:7px 11px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:18px 14px 45px;
}

.hero{
  background:linear-gradient(135deg,#0d2946,#091725);
  border:1px solid #1d3c59;
  border-radius:20px;
  padding:22px;
  margin-bottom:18px;
}

.hero h1{
  margin:0 0 7px;
  font-size:28px;
}

.hero p{
  margin:0;
  color:#91a6bb;
  font-size:14px;
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
  margin-bottom:14px;
}

.filter{
  border:1px solid #263c54;
  background:#0d1d2e;
  color:#b9c8d8;
  padding:11px 15px;
  border-radius:22px;
  white-space:nowrap;
  font-weight:bold;
  cursor:pointer;
}

.filter.active{
  background:#16d96b;
  color:#03100a;
  border-color:#16d96b;
}

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.counter{
  color:#879caf;
  font-size:13px;
}

.refresh{
  border:0;
  background:#1769e8;
  color:white;
  padding:10px 15px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.competition{
  margin-bottom:16px;
  border-radius:15px;
  overflow:hidden;
  border:1px solid #1b3045;
  background:#0a1828;
}

.competition-header{
  background:#0d2236;
  padding:13px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #1d344b;
}

.competition-name{
  font-size:14px;
  font-weight:bold;
}

.match-count{
  color:#8297ad;
  font-size:12px;
}

.match{
  padding:17px 13px;
  border-bottom:1px solid #192d42;
}

.match:last-child{
  border-bottom:0;
}

.match-date{
  text-align:center;
  color:#71869d;
  font-size:11px;
  margin-bottom:14px;
}

.match-row{
  display:grid;
  grid-template-columns:1fr 100px 1fr;
  align-items:center;
  gap:8px;
}

.team{
  text-align:center;
  font-weight:bold;
  font-size:13px;
}

.team.right{
  text-align:center;
}

.logo{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:8px;
}

.team-logo{
  width:52px;
  height:52px;
  object-fit:contain;
  background:white;
  border-radius:50%;
  padding:5px;
}

.logo-placeholder{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#172b40;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:22px;
}

.team-name{
  line-height:1.3;
}

.center{
  text-align:center;
}

.score{
  font-size:24px;
  font-weight:800;
}

.status{
  margin-top:6px;
  font-size:10px;
  font-weight:bold;
}

.status.live{
  color:#ff4052;
}

.status.finished{
  color:#16d96b;
}

.status.upcoming{
  color:#55a9ff;
}

.empty{
  background:#0d1d2e;
  border:1px solid #1d344a;
  border-radius:15px;
  padding:40px 15px;
  text-align:center;
  color:#8195aa;
}

.error{
  background:#32151c;
  border:1px solid #79313e;
  border-radius:15px;
  padding:25px 15px;
  text-align:center;
  color:#ff8d9a;
}

.loading{
  text-align:center;
  padding:35px;
  color:#91a5ba;
}

footer{
  text-align:center;
  color:#60758b;
  font-size:11px;
  padding:20px;
}

@media(max-width:600px){

  .hero h1{
    font-size:24px;
  }

  .match-row{
    grid-template-columns:1fr 72px 1fr;
  }

  .team{
    font-size:11px;
  }

  .team-logo,
  .logo-placeholder{
    width:44px;
    height:44px;
  }

  .score{
    font-size:20px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      ⚽ <span>Football</span> Live
    </div>

    <div class="live-badge">
      ● LIVE
    </div>

  </div>
</header>

<main class="container">

  <section class="hero">
    <h1>Football Live ⚽</h1>
    <p>Scores, matchs en direct et résultats</p>
  </section>

  <div class="filters">

    <button class="filter active" onclick="setFilter('all',this)">
      ⚽ Tous
    </button>

    <button class="filter" onclick="setFilter('live',this)">
      🔴 Direct
    </button>

    <button class="filter" onclick="setFilter('upcoming',this)">
      🕐 À venir
    </button>

    <button class="filter" onclick="setFilter('finished',this)">
      ✅ Terminés
    </button>

  </div>

  <div class="toolbar">

    <div id="counter" class="counter">
      Chargement...
    </div>

    <button class="refresh" onclick="loadMatches()">
      🔄 Actualiser
    </button>

  </div>

  <div id="matches">
    <div class="loading">
      ⚽ Chargement des matchs...
    </div>
  </div>

</main>

<footer>
  Football Live • Actualisation automatique
</footer>

<script>

let matches = [];
let currentFilter = "all";

function getStatus(match){

  const status = String(match.status || "").toUpperCase();

  if(
    status === "LIVE" ||
    status === "IN_PLAY" ||
    status === "PAUSED"
  ){
    return "live";
  }

  if(
    status === "FINISHED" ||
    status === "AWARDED"
  ){
    return "finished";
  }

  return "upcoming";
}

function setFilter(filter,button){

  currentFilter = filter;

  document
    .querySelectorAll(".filter")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  renderMatches();
}

function formatDate(value){

  if(!value) return "Date inconnue";

  const date = new Date(value);

  if(isNaN(date.getTime())){
    return "Date inconnue";
  }

  return date.toLocaleString("fr-FR",{
    day:"2-digit",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function getScore(match){

  const full =
    match.score &&
    match.score.fullTime
      ? match.score.fullTime
      : {};

  const home =
    full.home !== null &&
    full.home !== undefined
      ? full.home
      : "-";

  const away =
    full.away !== null &&
    full.away !== undefined
      ? full.away
      : "-";

  return home + " - " + away;
}

function teamHTML(team){

  const name =
    team &&
    (team.name || team.shortName || team.tla)
      ? (team.name || team.shortName || team.tla)
      : "Équipe";

  const crest =
    team &&
    team.crest
      ? team.crest
      : "";

  return `

    <div class="logo">

      ${
        crest
        ?
        `<img
          class="team-logo"
          src="${crest}"
          alt=""
          onerror="this.style.display='none'"
        >`
        :
        `<div class="logo-placeholder">⚽</div>`
      }

    </div>

    <div class="team-name">
      ${escapeHTML(name)}
    </div>

  `;
}

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function renderMatches(){

  const container =
    document.getElementById("matches");

  let filtered = matches.filter(match => {

    const status = getStatus(match);

    if(currentFilter === "live"){
      return status === "live";
    }

    if(currentFilter === "upcoming"){
      return status === "upcoming";
    }

    if(currentFilter === "finished"){
      return status === "finished";
    }

    return true;

  });

  document.getElementById("counter").textContent =
    filtered.length + " match(s)";

  if(filtered.length === 0){

    container.innerHTML = `
      <div class="empty">
        Aucun match dans cette catégorie.
      </div>
    `;

    return;
  }

  const groups = {};

  filtered.forEach(match => {

    const name =
      match.competition &&
      (
        match.competition.name ||
        match.competition.shortName
      )
      ||
      "Football";

    if(!groups[name]){
      groups[name] = [];
    }

    groups[name].push(match);

  });

  container.innerHTML = "";

  Object.keys(groups).forEach(competitionName => {

    const section =
      document.createElement("section");

    section.className = "competition";

    section.innerHTML = `

      <div class="competition-header">

        <div class="competition-name">
          🏆 ${escapeHTML(competitionName)}
        </div>

        <div class="match-count">
          ${groups[competitionName].length} match(s)
        </div>

      </div>

    `;

    groups[competitionName].forEach(match => {

      const status = getStatus(match);

      let statusText = "🕐 À VENIR";
      let statusClass = "upcoming";

      if(status === "live"){
        statusText = "🔴 EN DIRECT";
        statusClass = "live";
      }

      if(status === "finished"){
        statusText = "✅ TERMINÉ";
        statusClass = "finished";
      }

      const home =
        match.homeTeam || {};

      const away =
        match.awayTeam || {};

      const card =
        document.createElement("div");

      card.className = "match";

      card.innerHTML = `

        <div class="match-date">
          ${formatDate(match.utcDate)}
        </div>

        <div class="match-row">

          <div class="team">
            ${teamHTML(home)}
          </div>

          <div class="center">

            <div class="score">
              ${getScore(match)}
            </div>

            <div class="status ${statusClass}">
              ${statusText}
            </div>

          </div>

          <div class="team right">
            ${teamHTML(away)}
          </div>

        </div>

      `;

      section.appendChild(card);

    });

    container.appendChild(section);

  });

}

async function loadMatches(){

  const container =
    document.getElementById("matches");

  const counter =
    document.getElementById("counter");

  counter.textContent =
    "Actualisation...";

  try{

    const response =
      await fetch(
        "matches.json?time=" +
        Date.now()
      );

    if(!response.ok){
      throw new Error(
        "matches.json introuvable"
      );
    }

    const data =
      await response.json();

    matches =
      Array.isArray(data)
      ? data
      : (data.matches || []);

    renderMatches();

  }catch(error){

    console.error(error);

    counter.textContent = "";

    container.innerHTML = `

      <div class="error">

        ❌ Impossible de charger les matchs.

        <br><br>

        Vérifie que
        <b>matches.json</b>
        est bien présent dans ton dépôt.

      </div>

    `;

  }

}

loadMatches();

setInterval(
  loadMatches,
  60000
);

</script>

</body>
  </html>
