<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Live</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
}

header{
  background:linear-gradient(135deg,#0866ff,#063a9e);
  padding:25px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:34px;
}

header p{
  margin:9px 0 0;
  opacity:.9;
}

nav{
  display:flex;
  gap:9px;
  padding:12px;
  background:#0b182a;
  overflow-x:auto;
  position:sticky;
  top:0;
  z-index:20;
}

nav button{
  border:0;
  border-radius:25px;
  padding:11px 17px;
  background:#172b45;
  color:#fff;
  font-size:15px;
  white-space:nowrap;
}

nav button.active{
  background:#0866ff;
}

.container{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.search{
  display:none;
  margin-bottom:16px;
}

.search input{
  width:100%;
  padding:14px;
  border:1px solid #2b4563;
  border-radius:12px;
  background:#101f34;
  color:white;
  font-size:16px;
  outline:none;
}

.status{
  text-align:center;
  color:#b9cce3;
  padding:15px 5px;
}

.match{
  background:#10233a;
  border:1px solid #24415f;
  border-radius:18px;
  padding:17px;
  margin-bottom:16px;
}

.competition{
  color:#76aaff;
  font-weight:bold;
  margin-bottom:14px;
}

.teams{
  display:grid;
  grid-template-columns:1fr 100px 1fr;
  align-items:center;
  gap:8px;
  text-align:center;
}

.team{
  font-weight:bold;
  line-height:1.3;
}

.team img{
  width:55px;
  height:55px;
  object-fit:contain;
  display:block;
  margin:0 auto 8px;
}

.score{
  font-size:26px;
  font-weight:bold;
}

.badge{
  display:inline-block;
  margin-top:8px;
  padding:7px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
}

.live{
  background:#d71920;
}

.finished{
  background:#258a47;
}

.upcoming{
  background:#506176;
}

.date{
  text-align:center;
  color:#c0d1e6;
  margin:14px 0;
  font-size:14px;
}

.tv{
  border-top:1px solid #29415d;
  padding-top:12px;
  color:#ffd84d;
  line-height:1.5;
}

.watch{
  width:100%;
  margin-top:13px;
  border:0;
  border-radius:11px;
  padding:13px;
  background:#0866ff;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.watch:hover{
  background:#0754d0;
}

.empty{
  text-align:center;
  padding:40px 10px;
  color:#9db0c8;
}

/* Lecteur */

.player{
  display:none;
  background:#050a11;
  border:1px solid #243a54;
  border-radius:18px;
  padding:15px;
  margin-bottom:20px;
}

.player-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.player-header h2{
  margin:0;
  font-size:18px;
}

.close{
  border:0;
  border-radius:8px;
  padding:8px 11px;
  background:#d32f2f;
  color:white;
}

video{
  display:block;
  width:100%;
  margin-top:14px;
  background:#000;
  border-radius:10px;
  max-height:500px;
}

.player-message{
  text-align:center;
  color:#ffd84d;
  line-height:1.5;
}

@media(max-width:600px){
  .teams{
    grid-template-columns:1fr 85px 1fr;
  }

  .team{
    font-size:14px;
  }

  .score{
    font-size:22px;
  }

  .badge{
    font-size:11px;
    padding:6px 7px;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚽ Football Live</h1>
  <p>Matchs en direct, résultats et programmes TV</p>
</header>

<nav>
  <button id="btn-home"
          class="active"
          onclick="showPage('home')">
    🏠 Accueil
  </button>

  <button id="btn-search"
          onclick="showPage('search')">
    🔎 Recherche
  </button>

  <button id="btn-live"
          onclick="showPage('live')">
    🔴 En direct
  </button>

  <button id="btn-upcoming"
          onclick="showPage('upcoming')">
    🕐 À venir
  </button>

  <button id="btn-finished"
          onclick="showPage('finished')">
    ✅ Terminés
  </button>
</nav>

<main class="container">

  <div id="searchBox" class="search">
    <input
      id="searchInput"
      type="search"
      placeholder="Rechercher une équipe ou une compétition..."
      oninput="searchMatches()">
  </div>

  <!-- LECTEUR INTÉGRÉ -->

  <section id="playerSection" class="player">

    <div class="player-header">

      <h2 id="playerTitle">
        ⚽ Football Live
      </h2>

      <button class="close"
              onclick="closePlayer()">
        ✕
      </button>

    </div>

    <video id="videoPlayer"
           controls
           playsinline>
    </video>

    <div id="playerMessage"
         class="player-message">
    </div>

  </section>

  <div id="statusMessage"
       class="status">
    ⏳ Chargement des matchs...
  </div>

  <div id="matches"></div>

</main>

<script>

/* =====================================================
   CONFIGURATION
   ===================================================== */

const FOOTBALL_API_KEY = "FOOTBALL_API_KEY";

const API_URL =
  "https://v3.football.api-sports.io/fixtures";

const MATCHES_FILE =
  "matches.json";


/* =====================================================
   VARIABLES
   ===================================================== */

let allMatches = [];

let currentPage = "home";

let searchText = "";


/*
 * Cette variable mémorise le moment où les données
 * du match ont été chargées.
 */
let lastDataUpdate = Date.now();


/* =====================================================
   UTILITAIRES
   ===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttribute(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}


/* =====================================================
   NORMALISATION DES MATCHS
   ===================================================== */

function normalizeMatch(match){

  /*
   * Format API-Football
   */

  if(match && match.fixture){

    return {

      id:
        match.fixture.id,

      date:
        match.fixture.date,

      status:
        match.fixture.status?.short || "NS",

      elapsed:
        match.fixture.status?.elapsed ?? null,

      homeTeam:
        match.teams?.home?.name ||
        "Équipe domicile",

      awayTeam:
        match.teams?.away?.name ||
        "Équipe extérieure",

      homeLogo:
        match.teams?.home?.logo ||
        "",

      awayLogo:
        match.teams?.away?.logo ||
        "",

      homeScore:
        match.goals?.home,

      awayScore:
        match.goals?.away,

      competition:
        match.league?.name ||
        "Football",

      tv:
        match.tv ||
        match.channels ||
        "",

      streamUrl:
        match.streamUrl ||
        ""
    };
  }


  /*
   * Format matches.json
   */

  return {

    id:
      match?.id,

    date:
      match?.utcDate ||
      match?.date ||
      null,

    status:
      match?.status?.short ||
      match?.status ||
      "NS",

    elapsed:
      match?.status?.elapsed ??
      match?.elapsed ??
      match?.minute ??
      null,

    homeTeam:
      match?.homeTeam?.name ||
      match?.homeTeam ||
      "Équipe domicile",

    awayTeam:
      match?.awayTeam?.name ||
      match?.awayTeam ||
      "Équipe extérieure",

    homeLogo:
      match?.homeTeam?.crest ||
      match?.homeTeam?.logo ||
      match?.homeLogo ||
      "",

    awayLogo:
      match?.awayTeam?.crest ||
      match?.awayTeam?.logo ||
      match?.awayLogo ||
      "",

    homeScore:
      match?.score?.fullTime?.home ??
      match?.homeScore ??
      null,

    awayScore:
      match?.score?.fullTime?.away ??
      match?.awayScore ??
      null,

    competition:
      match?.competition?.name ||
      match?.competition ||
      "Football",

    tv:
      match?.tv ||
      match?.channels ||
      match?.broadcast ||
      "",

    streamUrl:
      match?.streamUrl ||
      match?.stream_url ||
      ""
  };
}


/* =====================================================
   STATUT
   ===================================================== */

function getStatus(match){

  const status =
    String(match.status || "")
      .toUpperCase();

  const liveStatuses = [
    "LIVE",
    "1H",
    "2H",
    "HT",
    "ET",
    "BT",
    "P",
    "INT",
    "IN_PLAY"
  ];

  const finishedStatuses = [
    "FT",
    "AET",
    "PEN",
    "FINISHED"
  ];

  if(liveStatuses.includes(status)){
    return "live";
  }

  if(finishedStatuses.includes(status)){
    return "finished";
  }

  return "upcoming";
}


/* =====================================================
   MINUTE DU MATCH
   ===================================================== */

function getLiveMinute(match){

  /*
   * La minute reçue par l'API / matches.json.
   */
  let minute = Number(match.elapsed);

  if(!Number.isFinite(minute)){
    return "";
  }


  /*
   * Si le match est en direct, on ajoute le temps
   * écoulé depuis le dernier chargement des données.
   *
   * Exemple :
   * API donne 37'
   * après 40 secondes : reste 37'
   * après 1 min 10 : 38'
   */

  if(getStatus(match) === "live"){

    const secondsPassed =
      Math.floor(
        (Date.now() - lastDataUpdate) / 1000
      );

    const extraMinutes =
      Math.floor(secondsPassed / 60);

    minute += extraMinutes;

    /*
     * On ne dépasse pas 90' avec ce système simple.
     * Les prolongations restent gérées par les données
     * réelles reçues de l'API.
     */
    if(
      match.status === "1H" &&
      minute > 45
    ){
      minute = 45;
    }
  }

  return ` — ${minute}'`;
}


/* =====================================================
   DATE + HEURE
   ===================================================== */

function formatDateTime(value){

  if(!value){
    return "Date inconnue";
  }

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){
    return "Date inconnue";
  }

  return new Intl.DateTimeFormat(
    "fr-FR",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  ).format(date);
}


/* =====================================================
   PAGE
   ===================================================== */

function showPage(page){

  currentPage = page;

  document
    .querySelectorAll("nav button")
    .forEach(button =>
      button.classList.remove("active")
    );

  const button =
    document.getElementById(
      "btn-" + page
    );

  if(button){
    button.classList.add("active");
  }

  const searchBox =
    document.getElementById("searchBox");

  searchBox.style.display =
    page === "search"
      ? "block"
      : "none";

  renderMatches();
}


/* =====================================================
   RECHERCHE
   ===================================================== */

function searchMatches(){

  searchText =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  renderMatches();
}


/* =====================================================
   FILTRAGE
   ===================================================== */

function getVisibleMatches(){

  let matches =
    allMatches.map(normalizeMatch);


  /*
   * Recherche
   */

  if(currentPage === "search"){

    if(searchText){

      matches =
        matches.filter(match => {

          return (
            match.homeTeam
              .toLowerCase()
              .includes(searchText) ||

            match.awayTeam
              .toLowerCase()
              .includes(searchText) ||

            String(match.competition)
              .toLowerCase()
              .includes(searchText)
          );

        });

    }

    return matches;
  }


  /*
   * Accueil
   */

  if(currentPage === "home"){
    return matches;
  }


  /*
   * En direct
   */

  if(currentPage === "live"){

    return matches.filter(
      match =>
        getStatus(match) === "live"
    );
  }


  /*
   * À venir
   */

  if(currentPage === "upcoming"){

    return matches.filter(
      match =>
        getStatus(match) === "upcoming"
    );
  }


  /*
   * Terminés
   */

  if(currentPage === "finished"){

    return matches.filter(
      match =>
        getStatus(match) === "finished"
    );
  }


  return matches;
}


/* =====================================================
   CARTE MATCH
   ===================================================== */

function createMatchCard(match){

  const status =
    getStatus(match);


  let badge;


  if(status === "live"){

    badge = `
      <span class="badge live">
        🔴 EN DIRECT${getLiveMinute(match)}
      </span>
    `;

  }else if(status === "finished"){

    badge = `
      <span class="badge finished">
        ✅ TERMINÉ
      </span>
    `;

  }else{

    badge = `
      <span class="badge upcoming">
        🕐 À VENIR
      </span>
    `;
  }


  const homeScore =
    match.homeScore !== null &&
    match.homeScore !== undefined
      ? match.homeScore
      : "-";


  const awayScore =
    match.awayScore !== null &&
    match.awayScore !== undefined
      ? match.awayScore
      : "-";


  const homeLogo =
    match.homeLogo
      ? `
        <img
          src="${escapeAttribute(match.homeLogo)}"
          alt="">
      `
      : "";


  const awayLogo =
    match.awayLogo
      ? `
        <img
          src="${escapeAttribute(match.awayLogo)}"
          alt="">
      `
      : "";


  const safeMatch =
    JSON.stringify(match)
      .replace(/'/g,"&#39;");


  return `

    <article class="match">

      <div class="competition">
        🏆 ${escapeHTML(match.competition)}
      </div>


      <div class="teams">

        <div class="team">

          ${homeLogo}

          ${escapeHTML(match.homeTeam)}

        </div>


        <div>

          <div class="score">
            ${escapeHTML(homeScore)}
            -
            ${escapeHTML(awayScore)}
          </div>

          ${badge}

        </div>


        <div class="team">

          ${awayLogo}

          ${escapeHTML(match.awayTeam)}

        </div>

      </div>


      <div class="date">

        📅
        ${escapeHTML(
          formatDateTime(match.date)
        )}

      </div>


      <div class="tv">

        📺 Diffusion TV :

        ${
          match.tv
            ? escapeHTML(match.tv)
            : "Informations non disponibles"
        }

      </div>


      <button
        class="watch"
        onclick='watchMatch(${safeMatch})'>

        ▶️ Regarder le match

      </button>

    </article>

  `;
}


/* =====================================================
   AFFICHAGE
   ===================================================== */

function renderMatches(){

  const container =
    document.getElementById("matches");


  const matches =
    getVisibleMatches();


  if(matches.length === 0){

    container.innerHTML = `
      <div class="empty">
        Aucun match trouvé.
      </div>
    `;

    return;
  }


  container.innerHTML =
    matches
      .map(createMatchCard)
      .join("");
}


/* =====================================================
   LECTEUR
   ===================================================== */

function watchMatch(match){

  const playerSection =
    document.getElementById(
      "playerSection"
    );

  const player =
    document.getElementById(
      "videoPlayer"
    );

  const title =
    document.getElementById(
      "playerTitle"
    );

  const message =
    document.getElementById(
      "playerMessage"
    );


  playerSection.style.display =
    "block";


  title.textContent =
    "⚽ " +
    match.homeTeam +
    " - " +
    match.awayTeam;


  player.pause();

  player.removeAttribute("src");

  player.load();


  /*
   * Si un flux officiel a été associé
   * au match, on le charge dans le lecteur.
   */

  if(match.streamUrl){

    player.style.display =
      "block";

    message.textContent =
      "";

    player.src =
      match.streamUrl;

    player.load();

    player.play().catch(
      () => {}
    );

  }else{

    /*
     * Pas de faux flux.
     */

    player.style.display =
      "none";

    message.textContent =
      "📺 La diffusion officielle de ce match n'est pas encore disponible.";
  }


  playerSection.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}


/* =====================================================
   FERMER LE LECTEUR
   ===================================================== */

function closePlayer(){

  const section =
    document.getElementById(
      "playerSection"
    );

  const player =
    document.getElementById(
      "videoPlayer"
    );


  player.pause();

  player.removeAttribute("src");

  player.load();

  section.style.display =
    "none";
}


/* =====================================================
   MATCHES.JSON
   ===================================================== */

async function loadLocalMatches(){

  const response =
    await fetch(
      MATCHES_FILE +
      "?t=" +
      Date.now(),
      {
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      "matches.json introuvable"
    );
  }


  const data =
    await response.json();


  if(Array.isArray(data)){

    return data;
  }


  if(
    data &&
    Array.isArray(data.matches)
  ){

    return data.matches;
  }


  if(
    data &&
    Array.isArray(data.response)
  ){

    return data.response;
  }


  throw new Error(
    "Format matches.json inconnu"
  );
}


/* =====================================================
   FOOTBALL API
   ===================================================== */

async function loadFootballAPI(){

  /*
   * Ne pas appeler l'API si la clé n'est
   * pas réellement configurée.
   */

  if(
    !FOOTBALL_API_KEY ||
    FOOTBALL_API_KEY ===
      "FOOTBALL_API_KEY"
  ){

    throw new Error(
      "Clé API non configurée"
    );
  }


  const today =
    new Date()
      .toISOString()
      .slice(0,10);


  const response =
    await fetch(
      API_URL +
      "?date=" +
      today,
      {
        headers:{
          "x-apisports-key":
            FOOTBALL_API_KEY
        }
      }
    );


  if(!response.ok){

    throw new Error(
      "API : " +
      response.status
    );
  }


  const data =
    await response.json();


  if(
    !data ||
    !Array.isArray(data.response)
  ){

    throw new Error(
      "Réponse API invalide"
    );
  }


  return data.response;
}


/* =====================================================
   CHARGEMENT PRINCIPAL
   ===================================================== */

async function loadMatches(){

  const statusMessage =
    document.getElementById(
      "statusMessage"
    );


  statusMessage.textContent =
    "⏳ Chargement des matchs...";


  try{

    /*
     * On utilise d'abord matches.json,
     * puisque ton workflow GitHub l'alimente.
     */

    allMatches =
      await loadLocalMatches();


    lastDataUpdate =
      Date.now();


    statusMessage.textContent =
      "✅ Matchs actualisés";

    renderMatches();

  }catch(error){

    console.error(error);


    /*
     * Si matches.json ne fonctionne pas,
     * on essaie Football API.
     */

    try{

      allMatches =
        await loadFootballAPI();


      lastDataUpdate =
        Date.now();


      statusMessage.textContent =
        "🟢 Matchs chargés depuis Football API";


      renderMatches();

    }catch(apiError){

      console.error(apiError);


      statusMessage.textContent =
        "❌ Impossible de charger les matchs.";


      document.getElementById(
        "matches"
      ).innerHTML = `

        <div class="empty">

          Vérifie que
          <strong>matches.json</strong>
          est bien présent dans ton dépôt.

        </div>

      `;
    }
  }
}


/* =====================================================
   DÉMARRAGE
   ===================================================== */

lo
