
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOOTBALL LIVE</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      text-align: center;
    }

    header {
      background: #111c33;
      padding: 25px 15px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      color: #b8c4d9;
      margin-top: 8px;
    }

    .container {
      padding: 25px 15px;
    }

    .match {
      background: #16233d;
      border-radius: 15px;
      padding: 20px;
      margin: 15px auto;
      max-width: 450px;
    }

    .teams {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .score {
      font-size: 30px;
      margin: 10px;
    }

    .status {
      color: #35d07f;
      font-weight: bold;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      color: #8795ad;
    }
  </style>
</head>

<body>

  <header>
    <h1>⚽ FOOTBALL LIVE</h1>
    <div class="subtitle">Matchs et scores en direct</div>
  </header>

  <div class="container">

    <div class="match">
      <div class="teams">Équipe A 🆚 Équipe B</div>
      <div class="score">2 - 1</div>
      <div class="status">● EN DIRECT</div>
    </div>

    <div class="match">
      <div class="teams">Équipe C 🆚 Équipe D</div>
      <div class="score">0 - 0</div>
      <div class="status">À VENIR</div>
    </div>

  </div>

  <footer>
    © 2026 FOOTBALL LIVE
  </footer>

</body>
</html>
