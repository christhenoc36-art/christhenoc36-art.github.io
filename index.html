<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOOTBALL LIVE</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
  padding-bottom:75px;
}

header{
  background:linear-gradient(135deg,#101d32,#172d4d);
  padding:24px 16px 20px;
  text-align:center;
}

.logo{
  font-size:30px;
  font-weight:800;
}

.logo span{color:#39e878}

.subtitle{
  color:#aebbd0;
  margin:7px 0 18px;
}

.search{
  max-width:650px;
  margin:auto;
}

.search input{
  width:100%;
  padding:14px 17px;
  border:0;
  border-radius:14px;
  font-size:16px;
  outline:0;
}

main{
  max-width:750px;
  margin:auto;
  padding:18px 15px;
}

.hero{
  background:#111f35;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
}

.hero h2{
  margin:0 0 8px;
}

.hero p{
  color:#aebbd0;
  margin:0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:18px 0;
}

.stat{
  background:#111f35;
  border-radius:15px;
  padding:15px 8px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:24px;
}

.stat span{
  color:#9eabc0;
  font-size:12px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:22px 0 12px;
}

.section-title h2{
  margin:0;
  font-size:20px;
}

.menu{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:5px 0 12px;
}

.menu button{
  border:0;
  border-radius:20px;
  padding:10px 15px;
  background:#172642;
  color:#fff;
  font-weight:bold;
  white-space:nowrap;
}

.menu button.active{
  background:#1769ff;
}

.match{
  background:#111f35;
  border-radius:18px;
  padding:17px;
  margin:12px 0;
  cursor:pointer;
  border:1px solid transparent;
}

.match:hover{
  border-color:#31547f;
}

.competition{
  color:#9eabc0;
  font-size:13px;
  margin-bottom:14px;
}

.teams{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  text-align:center;
}

.team{
  width:40%;
  font-weight:bold;
  line-height:1.35;
}

.team img{
  width:52px;
  height:52px;
  object-fit:contain;
  display:block;
  margin:0 auto 7px;
}

.vs{
  color:#718096;
  font-size:13px;
  font-weight:bold;
}

.score{
  text-align:center;
  font-size:29px;
  font-weight:800;
  margin:13px 0 8px;
}

.status{
  text-align:center;
  font-weight:bold;
}

.live{color:#ff4d4d}
.upcoming{color:#4da3ff}
.finished{color:#39e878}

.date{
  text-align:center;
  color:#7f8da3;
  font-size:12px;
  margin-top:9px;
}

.message{
  text-align:center;
  padding:35px 10px;
  color:#aebbd0;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:#101d32;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
  border-top:1px solid #203451;
}

.bottom-nav button{
  background:none;
  border:0;
  color:#8f9db2;
  font-size:12px;
}

.bottom-nav button.active{
  color:#39e878;
}

.bottom-nav div{
  font-size:22px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  z-index:50;
  padding:18px;
}

.modal-box{
  background:#111f35;
  max-width:600px;
  margin:45px auto;
  padding:22px;
  border-radius:20px;
}

.close{
  float:right;
  border:0;
  background:#263752;
  color:#fff;
  border-radius:50%;
  width:35px;
  height:35px;
  font-size:20px;
}

.detail-teams{
  display:flex;
  justify-content:space-around;
  align-items:center;
  text-align:center;
  margin-top:35px;
}

.detail-team{
  width:40%;
  font-weight:bold;
}

.detail-team img{
  width:70px;
  height:70px;
  object-fit:contain;
}

.detail-score{
  font-size:36px;
  font-weight:800;
}

.favorite{
  float:right;
  border:0;
  background:none;
  color:#ffd166;
  font-size:23px;
}
</style>
</head>

<body>

<header>

  <div class="logo">⚽ FOOTBALL <span>LIVE</span></div>

  <div class="subtitle">
    Toute l'actualité du football en direct
  </div>

  <div class="search">
    <input
      id="search"
      type="search"
      placeholder="🔎 Rechercher une équipe..."
    >
  </div>

</header>

<main>

  <section class="hero">
    <h2>🔥 Aujourd'hui</h2>
    <p>
      Retrouvez les matchs, résultats et scores de football.
    </p>
  </section>

  <section class="stats">

    <div class="stat">
      <strong id="statTotal">0</strong>
      <span>Matchs</span>
    </div>

    <div class="stat">
      <strong id="statLive">0</strong>
      <span>En direct</span>
    </div>

    <div class="stat">
      <strong id="statFinished">0</strong>
      <span>Terminés</span>
    </div>

  </section>

  <div class="section-title">
    <h2>⚽ Matchs</h2>
  </div>

  <nav class="menu">

    <button class="active" data-filter="all">
      Tous
    </button>

    <button data-filter="live">
      🔴 Live
    </button>

    <button data-filter="upcoming">
      🕐 À venir
    </button>

    <button data-filter="finished">
      ✅ Résultats
    </button>

  </nav>

  <section id="matches">

    <div class="message">
      ⏳ Chargement des matchs...
    </div>

  </section>

</main>

<nav class="bottom-nav">

  <button class="active" onclick="allerAccueil()">
    <div>🏠</div>
    Accueil
  </button>

  <button onclick="choisirFiltre('live')">
    <div>🔴</div>
    Live
  </button>

  <button onclick="choisirFiltre('upcoming')">
    <div>📅</div>
    À venir
  </button>

  <button onclick="choisirFiltre('finished')">
    <div>🏆</div>
    Résultats
  </button>

</nav>

<footer></footer>

<div class="modal" id="modal">

  <div class="modal-box">

    <button class="close" onclick="fermerDetail()">
      ×
    </button>

    <div id="detail"></div>

  </div>

</div>

<script>

let matchs=[];
let filtre="all";

const favoris=
  JSON.parse(localStorage.getItem("favorisFootball") || "[]");


function statutFrancais(statut){

  const traduction={
    IN_PLAY:"🔴 EN DIRECT",
    PAUSED:"⏸️ PAUSE",
    FINISHED:"✅ TERMINÉ",
    SCHEDULED:"🕐 À VENIR",
    TIMED:"🕐 À VENIR",
    POSTPONED:"⏸️ REPORTÉ",
    CANCELLED:"❌ ANNULÉ",
    SUSPENDED:"⚠️ SUSPENDU"
  };

  return traduction[statut] || "🕐 À VENIR";
}


function categorie(statut){

  if(statut==="IN_PLAY" || statut==="PAUSED")
    return "live";

  if(statut==="FINISHED")
    return "finished";

  return "upcoming";
}


function dateFr(date){

  if(!date) return "";

  return new Date(date).toLocaleString(
    "fr-FR",
    {
      dateStyle:"short",
      timeStyle:"short"
    }
  );
}


function mettreAJourStats(){

  document.getElementById("statTotal").textContent=
    matchs.length;

  document.getElementById("statLive").textContent=
    matchs.filter(
      m=>categorie(m.status)==="live"
    ).length;

  document.getElementById("statFinished").textContent=
    matchs.filter(
      m=>categorie(m.status)==="finished"
    ).length;
}


function afficherMatchs(){

  const zone=
    document.getElementById("matches");

  const recherche=
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const liste=matchs.filter(match=>{

    const cat=categorie(match.status);

    const home=
      match.homeTeam?.name || "";

    const away=
      match.awayTeam?.name || "";

    const texte=
      (home+" "+away).toLowerCase();


    return (
      (filtre==="all" || filtre===cat) &&
      (
        recherche==="" ||
        texte.includes(recherche)
      )
    );

  });


  if(liste.length===0){

    zone.innerHTML=
      `<div class="message">
        ⚽ Aucun match trouvé.
      </div>`;

    return;
  }


  zone.innerHTML="";


  liste.forEach(match=>{

    const home=
      match.homeTeam?.name ||
      "Équipe domicile";

    const away=
      match.awayTeam?.name ||
      "Équipe extérieure";

    const homeLogo=
      match.homeTeam?.crest || "";

    const awayLogo=
      match.awayTeam?.crest || "";

    const homeScore=
      match.score?.fullTime?.home ?? "-";

    const awayScore=
      match.score?.fullTime?.away ?? "-";

    const status=
      match.status || "SCHEDULED";

    const cat=
      categorie(status);

    const competition=
      match.competition?.name ||
      "Football";

    const date=
      dateFr(match.utcDate);


    const id=
      String(match.id || home+"-"+away);


    const estFavori=
      favoris.includes(id);


    const card=
      document.createElement("article");

    card.className="match";


    card.innerHTML=`

      <button class="favorite"
        onclick="event.stopPropagation();
        basculerFavori('${id}')">
        ${estFavori ? "★" : "☆"}
      </button>

      <div class="competition">
        🏆 ${competition}
      </div>

      <div class="teams">

        <div class="team">

          ${
            homeLogo
            ? `<img src="${homeLogo}" alt="">`
            : "⚽"
          }

          ${home}

        </div>

        <div class="vs">
          VS
        </div>

        <div class="team">

          ${
            awayLogo
            ? `<img src="${awayLogo}" alt="">`
            : "⚽"
          }

          ${away}

        </div>

      </div>

      <div class="score">
        ${homeScore} - ${awayScore}
      </div>

      <div class="status ${cat}">
        ${statutFrancais(status)}
      </div>

      <div class="date">
        ${date}
      </div>

    `;


    card.onclick=
      ()=>ouvrirDetail(match);


    zone.appendChild(card);

  });

}


function basculerFavori(id){

  const index=
    favoris.indexOf(id);


  if(index>=0){

    favoris.splice(index,1);

  }else{

    favoris.push(id);

  }


  localStorage.setItem(
    "favorisFootball",
    JSON.stringify(favoris)
  );


  afficherMatchs();
}


function ouvrirDetail(match){

  const home=
    match.homeTeam?.name ||
    "Équipe domicile";

  const away=
    match.awayTeam?.name ||
    "Équipe extérieure";

  const homeLogo=
    match.homeTeam?.crest || "";

  const awayLogo=
    match.awayTeam?.crest || "";

  const homeScore=
    match.score?.fullTime?.home ?? "-";

  const awayScore=
    match.score?.fullTime?.away ?? "-";

  const competition=
    match.competition?.name ||
    "Football";


  document.getElementById("detail").innerHTML=`

    <h2>🏆 ${competition}</h2>

    <div class="detail-teams">

      <div class="detail-team">

        ${
          homeLogo
          ? `<img src="${homeLogo}" alt="">`
          : "⚽"
        }

        <p>${home}</p>

      </div>

      <div>

        <div class="detail-score">
          ${homeScore} - ${awayScore}
        </div>

        <p>
          ${statutFrancais(
            match.status || "SCHEDULED"
          )}
        </p>

      </div>

      <div class="detail-team">

        ${
          awayLogo
          ? `<img src="${awayLogo}" alt="">`
          : "⚽"
        }

        <p>${away}</p>

      </div>

    </div>

    <p>
      🕐 ${dateFr(match.utcDate)}
    </p>

  `;


  document.getElementById("modal")
    .style.display="block";
}


function fermerDetail(){

  document.getElementById("modal")
    .style.display="none";
}


function choisirFiltre(nouveauFiltre){

  filtre=nouveauFiltre;

  document
    .querySelectorAll(".menu button")
    .forEach(button=>{

      button.classList.toggle(
        "active",
        button.dataset.filter===filtre
      );

    });

  afficherMatchs();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


function allerAccueil(){

  filtre="all";

  document
    .querySelectorAll(".menu button")
    .forEach(button=>{

      button.classList.toggle(
        "active",
        button.dataset.filter==="all"
      );

    });

  afficherMatchs();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


document
  .querySelectorAll(".menu button")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{
        choisirFiltre(
          button.dataset.filter
        );
      }
    );

  });


document
  .getElementById("search")
  .addEventListener(
    "input",
    afficherMatchs
  );


async function chargerMatchs(){

  try{

    const response=
      await fetch(
        "matches.json?cache="+Date.now()
      );


    if(!response.ok)
      throw new Error();


    const data=
      await response.json();


    matchs=
      data.matches || [];


    mettreAJourStats();

    afficherMatchs();


  }catch(error){

    document.getElementById("matches")
      .innerHTML=`

      <div class="message">
        ❌ Impossible de charger les matchs.
      </div>

      `;

  }

}


chargerMatchs();


setInterval(
  chargerMatchs,
  60000
);

</script>

</body>
  </html>
