<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Live</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
    }

    header {
      background: linear-gradient(135deg, #0866ff, #073bba);
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 38px;
    }

    header p {
      margin: 12px 0 0;
      font-size: 18px;
      opacity: .9;
    }

    nav {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: #0b182a;
      overflow-x: auto;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav button {
      border: 0;
      border-radius: 25px;
      padding: 12px 20px;
      background: #172b45;
      color: white;
      font-size: 16px;
      white-space: nowrap;
      cursor: pointer;
    }

    nav button.active {
      background: #0866ff;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px 15px 50px;
    }

    .search-box {
      display: none;
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #304866;
      background: #101f34;
      color: white;
      font-size: 17px;
      outline: none;
    }

    .message {
      padding: 18px;
      text-align: center;
      border-radius: 14px;
      margin-bottom: 20px;
      background: #10233a;
      color: #bcd0e8;
    }

    .match {
      background: #10233a;
      border: 1px solid #24415f;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,.2);
    }

    .competition {
      color: #8fb8ff;
      font-size: 17px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .date {
      text-align: center;
      color: #b8c9dd;
      margin: 15px 0;
      font-size: 15px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .team {
      font-weight: bold;
      font-size: 18px;
    }

    .team img {
      width: 65px;
      height: 65px;
      object-fit: contain;
      display: block;
      margin: 0 auto 10px;
    }

    .score {
      font-size: 30px;
      font-weight: bold;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      padding: 9px 14px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
      margin-top: 8px;
    }

    .badge-live {
      background: #16863c;
      color: white;
    }

    .badge-upcoming {
      background: #34465c;
      color: white;
    }

    .badge-finished {
      background: #555f6d;
      color: white;
    }

    .tv {
      border-top: 1px solid #29425e;
      margin-top: 18px;
      padding-top: 15px;
      color: #ffd84d;
      font-size: 16px;
    }

    .watch {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      background: #0866ff;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .watch:hover {
      background: #0755d4;
    }

    .watch:disabled {
      background: #46576b;
      cursor: not-allowed;
    }

    #playerSection {
      display: none;
      background: #0c1c2e;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 25px;
    }

    #playerSection h2 {
      margin-top: 0;
    }

    video {
      width: 100%;
      max-height: 500px;
      background: black;
      border-radius: 12px;
    }

    #playerMessage {
      text-align: center;
      color: #ffd84d;
      padding: 15px;
    }

    .empty {
      text-align: center;
      padding: 40px 15px;
      color: #aabbd0;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 30px;
      }

      .teams {
        grid-template-columns: 1fr 90px 1fr;
      }

      .team {
        font-size: 15px;
      }

      .team img {
        width: 55px;
        height: 55px;
      }

      .score {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ Football Live</h1>
  <p>Matchs en direct, résultats et programmes TV</p>
</header>

<nav>
  <button id="homeBtn" class="active" onclick="showPage('home')">
    🏠 Accueil
  </button>

  <button id="searchBtn" onclick="showPage('search')">
    🔎 Recherche
  </button>

  <button id="liveBtn" onclick="showPage('live')">
    🔴 En direct
  </button>

  <button id="upcomingBtn" onclick="showPage('upcoming')">
    🕐 À venir
  </button>

  <button id="finishedBtn" onclick="showPage('finished')">
    ✅ Terminés
  </button>
</nav>

<main class="container">

  <div id="searchBox" class="search-box">
    <input
      id="searchInput"
      type="search"
      placeholder="Rechercher une équipe ou un match..."
      oninput="searchMatches()"
    >
  </div>

  <section id="playerSection">
    <h2 id="matchTitle">Match</h2>

    <video
      id="videoPlayer"
      controls
      playsinline
      preload="metadata">
    </video>

    <p id="playerMessage">
      La diffusion officielle de ce match n'est pas encore disponible.
    </p>
  </section>

  <div id="statusMessage" class="message">
    ⏳ Chargement des matchs...
  </div>

  <div id="matches"></div>

</main>

<script>
  /*
   * =====================================================
   * CONFIGURATION
   * =====================================================
   *
   * IMPORTANT :
   * Une clé placée ici sera visible dans le navigateur.
   * Pour un site public, il faudra ensuite utiliser
   * un serveur/proxy pour protéger la clé.
   */

  const FOOTBALL_API_KEY = "FOOTBALL_API_KEY";

  const API_URL = "https://v3.football.api-sports.io/fixtures";

  let allMatches = [];
  let currentPage = "home";


  /*
   * =====================================================
   * NAVIGATION
   * =====================================================
   */

  function showPage(page) {
    currentPage = page;

    document.querySelectorAll("nav button").forEach(button => {
      button.classList.remove("active");
    });

    if (page === "home") {
      document.getElementById("homeBtn").classList.add("active");
      document.getElementById("searchBox").style.display = "none";
    }

    if (page === "search") {
      document.getElementById("searchBtn").classList.add("active");
      document.getElementById("searchBox").style.display = "block";
      document.getElementById("searchInput").focus();
    }

    if (page === "live") {
      document.getElementById("liveBtn").classList.add("active");
      document.getElementById("searchBox").style.display = "none";
    }

    if (page === "upcoming") {
      document.getElementById("upcomingBtn").classList.add("active");
      document.getElementById("searchBox").style.display = "none";
    }

    if (page === "finished") {
      document.getElementById("finishedBtn").classList.add("active");
      document.getElementById("searchBox").style.display = "none";
    }

    renderMatches();
  }


  /*
   * =====================================================
   * CHARGEMENT
   * =====================================================
   */

  async function loadMatches() {

    const statusMessage = document.getElementById("statusMessage");

    try {

      /*
       * Si une vraie clé est configurée,
       * on essaie Football API.
       */

      if (
        FOOTBALL_API_KEY &&
        FOOTBALL_API_KEY !== "FOOTBALL_API_KEY"
      ) {

        const response = await fetch(API_URL, {
          headers: {
            "x-apisports-key": FOOTBALL_API_KEY
          }
        });

        if (!response.ok) {
          throw new Error("API error");
        }

        const data = await response.json();

        if (data.response && Array.isArray(data.response)) {
          allMatches = data.response;
          statusMessage.textContent =
            "🟢 Matchs chargés depuis Football API";
          renderMatches();
          return;
        }
      }

      throw new Error("API unavailable");

    } catch (error) {

      /*
       * Secours :
       * matches.json
       */

      try {

        const response = await fetch("matches.json?t=" + Date.now());

        if (!response.ok) {
          throw new Error("matches.json introuvable");
        }

        const data = await response.json();

        allMatches = Array.isArray(data)
          ? data
          : (data.matches || []);

        statusMessage.textContent =
          "⚠️ API indisponible — matches.json utilisé";

        renderMatches();

      } catch (jsonError) {

        statusMessage.textContent =
          "❌ Impossible de charger les matchs.";

        document.getElementById("matches").innerHTML =
          '<div class="empty">Aucun match disponible.</div>';
      }
    }
  }


  /*
   * =====================================================
   * NORMALISATION
   * =====================================================
   */

  function normalizeMatch(match) {

    /*
     * Format Football API
     */

    if (match.fixture) {

      return {
        id: match.fixture.id,

        date: match.fixture.date,

        status: match.fixture.status?.short || "NS",

        elapsed: match.fixture.status?.elapsed ?? null,

        homeTeam:
          match.teams?.home?.name || "Équipe domicile",

        awayTeam:
          match.teams?.away?.name || "Équipe extérieure",

        homeLogo:
          match.teams?.home?.logo || "",

        awayLogo:
          match.teams?.away?.logo || "",

        homeScore:
          match.goals?.home,

        awayScore:
          match.goals?.away,

        competition:
          match.league?.name || "Football",

        tv:
          match.tv || "",

        streamUrl:
          match.streamUrl || ""
      };
    }


    /*
     * Format matches.json
     */

    const utcDate =
      match.utcDate ||
      match.date ||
      null;

    return {
      id: match.id,

      date: utcDate,

      status:
        match.status ||
        match.statusShort ||
        "NS",

      elapsed:
        match.elapsed ??
        match.minute ??
        null,

      homeTeam:
        match.homeTeam?.name ||
        match.homeTeam ||
        "Équipe domicile",

      awayTeam:
        match.awayTeam?.name ||
        match.awayTeam ||
        "Équipe extérieure",

      homeLogo:
        match.homeTeam?.crest ||
        match.homeTeam?.logo ||
        match.homeLogo ||
        "",

      awayLogo:
        match.awayTeam?.crest ||
        match.awayTeam?.logo ||
        match.awayLogo ||
        "",

      homeScore:
        match.score?.fullTime?.home ??
        match.homeScore ??
        null,

      awayScore:
        match.score?.fullTime?.away ??
        match.awayScore ??
        null,

      competition:
        match.competition?.name ||
        match.competition ||
        "Football",

      tv:
        match.tv ||
        match.broadcast ||
        "",

      streamUrl:
        match.streamUrl ||
        ""
    };
  }


  /*
   * =====================================================
   * STATUT
   * =====================================================
   */

  function getStatus(match) {

    const status = String(match.status || "").toUpperCase();

    const liveStatuses = [
      "LIVE",
      "1H",
      "2H",
      "HT",
      "ET",
      "P",
      "INT"
    ];

    const finishedStatuses = [
      "FT",
      "AET",
      "PEN",
      "FINISHED"
    ];

    if (liveStatuses.includes(status)) {
      return "live";
    }

    if (finishedStatuses.includes(status)) {
      return "finished";
    }

    return "upcoming";
  }


  /*
   * =====================================================
   * DATE + HEURE
   * =====================================================
   */

  function formatDateTime(dateString) {

    if (!dateString) {
      return "Date inconnue";
    }

    const date = new Date(dateString);

    if (isNaN(date.getTime())) {
      return "Date inconnue";
    }

    return new Intl.DateTimeFormat("fr-FR", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }).format(date);
  }


  /*
   * =====================================================
   * MINUTE DU DIRECT
   * =====================================================
   */

  function getLiveMinute(match) {

    const elapsed = match.elapsed;

    if (
      elapsed !== null &&
      elapsed !== undefined &&
      elapsed !== ""
    ) {
      return " — " + elapsed + "'";
    }

    return "";
  }


  /*
   * =====================================================
   * AFFICHAGE
   * =====================================================
   */

  function renderMatches(list = null) {

    const container =
      document.getElementById("matches");

    let matches = list || allMatches;

    if (!Array.isArray(matches)) {
      matches = [];
    }

    /*
     * Filtre des pages
     */

    if (!list) {

      if (currentPage === "live") {
        matches = matches.filter(
          match => getStatus(normalizeMatch(match)) === "live"
        );
      }

      if (currentPage === "upcoming") {
        matches = matches.filter(
          match => getStatus(normalizeMatch(match)) === "upcoming"
        );
      }

      if (currentPage === "finished") {
        matches = matches.filter(
          match => getStatus(normalizeMatch(match)) === "finished"
        );
      }
    }

    if (matches.length === 0) {

      container.innerHTML =
        '<div class="empty">Aucun match trouvé.</div>';

      return;
    }

    container.innerHTML =
      matches.map(match => createMatchHTML(normalizeMatch(match))).join("");
  }


  /*
   * =====================================================
   * CARTE MATCH
   * =====================================================
   */

  function createMatchHTML(match) {

    const status = getStatus(match);

    let badge = "";

    if (status === "live") {

      badge = `
        <span class="badge badge-live">
          🔴 EN DIRECT${getLiveMinute(match)}
        </span>
      `;

    } else if (status === "finished") {

      badge = `
        <span class="badge badge-finished">
          ✅ TERMINÉ
        </span>
      `;

    } else {

      badge = `
        <span class="badge badge-upcoming">
          🕐 À VENIR
        </span>
      `;
    }


    const homeScore =
      match.homeScore !== null &&
      match.homeScore !== undefined
        ? match.homeScore
        : "-";

    const awayScore =
      match.awayScore !== null &&
      match.awayScore !== undefined
        ? match.awayScore
        : "-";


    return `
      <article class="match">

        <div class="competition">
          🏆 ${escapeHTML(match.competition)}
        </div>

        <div class="teams">

          <div class="team">
            ${
              match.homeLogo
                ? `<img
                    src="${escapeAttribute(match.homeLogo)}"
                    alt="">
                  `
                : ""
            }

            ${escapeHTML(match.homeTeam)}
          </div>

          <div>

            <div class="score">
              ${homeScore} - ${awayScore}
            </div>

            ${badge}

          </div>

          <div class="team">
            ${
              match.awayLogo
                ? `<img
                    src="${escapeAttribute(match.awayLogo)}"
                    alt="">
                  `
                : ""
            }

            ${escapeHTML(match.awayTeam)}
          </div>

        </div>

        <div class="date">
          📅 ${formatDateTime(match.date)}
        </div>

        ${
          match.tv
            ? `
              <div class="tv">
                📺 Diffusion TV :
                ${escapeHTML(match.tv)}
              </div>
            `
            : `
              <div class="tv">
                📺 Diffusion TV :
                Informations non disponibles
              </div>
            `
        }

        <button
          class="watch"
          onclick='regarderMatch(${JSON.stringify(match)})'>
          ▶️ Regarder le match
        </button>

      </article>
    `;
  }


  /*
   * =====================================================
   * LECTEUR
   * =====================================================
   */

  function regarderMatch(match) {

    const playerSection =
      document.getElementById("playerSection");

    const player =
      document.getElementById("videoPlayer");

    const title =
      document.getElementById("matchTitle");

    const message =
      document.getElementById("playerMessage");

    playerSection.style.display = "block";

    title.textContent =
      match.homeTeam + " - " + match.awayTeam;

    player.pause();

    player.removeAttribute("src");

    message.textContent = "";


    /*
     * Seul un flux officiel fourni/configuré
     * dans streamUrl est utilisé.
     */

    if (!match.streamUrl) {

      message.textContent =
        "La diffusion officielle de ce match n'est pas encore disponible.";

      player.style.display = "none";

      playerSection.scrollIntoView({
        behavior: "smooth"
      });

      return;
    }


    player.style.display = "block";

    player.src = match.streamUrl;

    player.load();

    playerSection.scrollIntoView({
      behavior: "smooth"
    });

    player.play().catch(() => {});
  }


  /*
   * =====================================================
   * RECHERCHE
   * =====================================================
   */

  function searchMatches() {

    const query =
      document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    if (!query) {
      renderMatches();
      return;
    }

    const results =
      allMatches.filter(item => {

        const match =
          normalizeMatch(item);

        return (
          String(match.homeTeam)
            .toLowerCase()
            .includes(query) ||

          String(match.awayTeam)
            .toLowerCase()
            .includes(query) ||

          String(match.competition)
            .toLowerCase()
            .includes(query)
        );
      });

    renderMatches(results);
  }


  /*
   * =====================================================
   * SÉCURITÉ AFFICHAGE
   * =====================================================
   */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function escapeAttribute(value) {

    return String(value ?? "")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }


  /*
   * =====================================================
   * RAFRAÎCHISSEMENT
   * =====================================================
   */

  loadMatches();

  /*
   * Actualisation toutes les 60 secondes.
   * Cela permet notamment de mettre à jour
   * les matchs en direct.
   */

  setInterval(() => {
    loadMatches();
  }, 60000);

</script>

</body>
  </html>
