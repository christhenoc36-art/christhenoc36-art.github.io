<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="300">
<title>Football Live</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #07111f;
  color: white;
}

header {
  background: #0b1d33;
  padding: 22px 15px;
  text-align: center;
  border-bottom: 2px solid #163b61;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 8px 0 0;
  color: #a9c8e8;
}

.container {
  width: 94%;
  max-width: 800px;
  margin: 20px auto;
}

.status {
  background: #12304d;
  padding: 15px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 20px;
  font-size: 18px;
}

.match {
  background: #0d1b2d;
  border: 1px solid #23476d;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 5px 18px rgba(0,0,0,.25);
}

.competition {
  color: #75b8ff;
  font-size: 14px;
  margin-bottom: 15px;
  text-align: center;
}

.teams {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.team {
  width: 40%;
  text-align: center;
}

.team img {
  width: 65px;
  height: 65px;
  object-fit: contain;
  display: block;
  margin: 0 auto 8px;
}

.team-name {
  font-weight: bold;
  font-size: 15px;
}

.score {
  font-size: 22px;
  font-weight: bold;
  width: 20%;
  text-align: center;
}

.datetime {
  text-align: center;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid #23405e;
  color: #d7e8fa;
}

.tv {
  margin-top: 14px;
  background: #132b43;
  border-radius: 12px;
  padding: 12px;
}

.tv-title {
  color: #ffd65a;
  font-weight: bold;
  margin-bottom: 7px;
}

.tv-channel {
  padding: 5px 0;
  color: #f1f6fb;
}

.empty {
  text-align: center;
  padding: 40px 15px;
  color: #aabbd0;
}

.error {
  background: #4a1820;
  color: #ffb8c0;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
}
</style>
</head>

<body>

<header>
  <h1>⚽ Football Live</h1>
  <p>Matchs, scores et diffusion TV en direct</p>
</header>

<div class="container">

  <div id="status" class="status">
    Chargement des matchs...
  </div>

  <div id="matches"></div>

</div>

<script>

async function chargerMatchs() {

  const status = document.getElementById("status");
  const container = document.getElementById("matches");

  try {

    const response = await fetch(
      "matches.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("matches.json introuvable");
    }

    const data = await response.json();

    let matchs = [];

    /*
      Le workflow peut enregistrer :
      - directement un tableau
      - ou un objet contenant matches
    */

    if (Array.isArray(data)) {
      matchs = data;
    } else if (Array.isArray(data.matches)) {
      matchs = data.matches;
    } else if (Array.isArray(data.response)) {
      matchs = data.response;
    }

    if (!matchs.length) {
      status.textContent = "Aucun match disponible";
      container.innerHTML =
        '<div class="empty">Aucun match trouvé pour le moment.</div>';
      return;
    }

    status.textContent =
      matchs.length + " match" + (matchs.length > 1 ? "s" : "") +
      " disponible" + (matchs.length > 1 ? "s" : "");

    container.innerHTML = "";

    matchs.forEach(match => {

      const home = match.homeTeam || match.home || {};
      const away = match.awayTeam || match.away || {};
      const competition = match.competition || {};

      const homeName =
        home.name ||
        home.shortName ||
        "Équipe inconnue";

      const awayName =
        away.name ||
        away.shortName ||
        "Équipe inconnue";

      const homeLogo =
        home.crest ||
        home.logo ||
        "";

      const awayLogo =
        away.crest ||
        away.logo ||
        "";

      const competitionName =
        competition.name ||
        match.league?.name ||
        "Compétition";

      const dateValue =
        match.utcDate ||
        match.date ||
        match.startDate ||
        "";

      let dateText = "Date inconnue";
      let timeText = "Heure inconnue";

      if (dateValue) {

        const date = new Date(dateValue);

        if (!isNaN(date.getTime())) {

          dateText = date.toLocaleDateString(
            "fr-FR",
            {
              day: "2-digit",
              month: "2-digit",
              year: "numeric"
            }
          );

          timeText = date.toLocaleTimeString(
            "fr-FR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );
        }
      }

      let homeScore = "-";
      let awayScore = "-";

      if (match.score && match.score.fullTime) {

        homeScore =
          match.score.fullTime.home ?? "-";

        awayScore =
          match.score.fullTime.away ?? "-";
      }

      /*
        Récupération des chaînes TV
      */

      let tvChannels =
        match.tvChannels ||
        match.tv ||
        [];

      if (!Array.isArray(tvChannels)) {
        tvChannels = [];
      }

      const tvHTML = tvChannels.length
        ? `
          <div class="tv">
            <div class="tv-title">📺 Diffusion TV</div>
            ${tvChannels.map(channel => {

              const name =
                typeof channel === "string"
                  ? channel
                  : channel.name || "Chaîne TV";

              return `
                <div class="tv-channel">
                  📺 ${escapeHTML(name)}
                </div>
              `;

            }).join("")}
          </div>
        `
        : "";

      const card = document.createElement("div");

      card.className = "match";

      card.innerHTML = `

        <div class="competition">
          🏆 ${escapeHTML(competitionName)}
        </div>

        <div class="teams">

          <div class="team">

            ${
              homeLogo
              ? `<img src="${escapeHTML(homeLogo)}"
                      alt="${escapeHTML(homeName)}"
                      onerror="this.style.display='none'">`
              : ""
            }

            <div class="team-name">
              ${escapeHTML(homeName)}
            </div>

          </div>

          <div class="score">
            ${homeScore} - ${awayScore}
          </div>

          <div class="team">

            ${
              awayLogo
              ? `<img src="${escapeHTML(awayLogo)}"
                      alt="${escapeHTML(awayName)}"
                      onerror="this.style.display='none'">`
              : ""
            }

            <div class="team-name">
              ${escapeHTML(awayName)}
            </div>

          </div>

        </div>

        <div class="datetime">
          📅 ${dateText}
          <br>
          🕐 ${timeText}
        </div>

        ${tvHTML}

      `;

      container.appendChild(card);

    });

  } catch (error) {

    console.error(error);

    status.textContent = "Erreur de chargement";

    container.innerHTML = `
      <div class="error">
        ❌ Impossible de charger les matchs.<br><br>
        Vérifie que <b>matches.json</b> existe bien.
      </div>
    `;
  }
}


function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


chargerMatchs();

setInterval(chargerMatchs, 300000);

</script>

</body>
  </html>
